<!doctype html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EpiPrint · Lab</title>
<style>
/* ============================================================
   EpiPrint · Lab — минималистичный «LIMS»-слой.
   Плоско, плотно, серо-белая палитра + один акцент. Данные — главное.
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  /* токены дизайн-системы (нужны заключению и хитмапу) */
  --brand:#0f6b70; --brand-600:#0f6b70; --brand-700:#0b5155; --brand-050:#eef4f4;
  --pass:#157f45; --pass-bg:#e8f3ec; --warn:#a86400; --warn-bg:#f6efe2; --fail:#bd3a2c; --fail-bg:#f7e9e6;
  --info:#2b5cc4; --info-bg:#eaeef8; --queued:#7b828a; --queued-bg:#eef0f2;
  --risk-high:#bd3a2c; --risk-high-bg:#f7e9e6; --risk-med:#a86400; --risk-med-bg:#f6efe2; --risk-low:#157f45; --risk-low-bg:#e8f3ec;
  --hm-0:#2c6fb3; --hm-mid:#f1f1ec; --hm-1:#bd3a2c;
  --disp:"Montserrat", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --ink:#15181c; --ink-2:#565d64; --ink-3:#878e96; --faint:#a6adb4;
  --bg:#f4f5f6; --surface:#ffffff; --surface-2:#fafbfb;
  --line:#e1e4e7; --line-2:#eef0f2;
  --accent:var(--brand);

  --sb-w:200px;
  --row:30px;          /* высота строки таблицы (comfortable) */
  --gap:20px;          /* ритм: 40/24/12/6 — используем осмысленно */
}
body.dense{ --row:23px; --gap:12px; font-size:12px; }

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ font-family:var(--body); color:var(--ink); background:var(--bg); font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased; }
a{ color:var(--brand); text-decoration:none; }
a:hover{ text-decoration:underline; }
.mono{ font-family:var(--mono); }
.muted{ color:var(--ink-2); }
.faint{ color:var(--ink-3); }
.spacer{ flex:1; }
.nowrap{ white-space:nowrap; }
.right{ text-align:right; }
hr.rule{ border:0; border-top:1px solid var(--line); margin:var(--gap) 0; }

/* ---------- layout ---------- */
.layout{ display:flex; min-height:100vh; }
.main{ flex:1; min-width:0; margin-left:var(--sb-w); display:flex; flex-direction:column; }
.content{ padding:16px 20px 48px; max-width:1500px; width:100%; }
body.dense .content{ padding:12px 16px 40px; }

/* ---------- sidebar (light) ---------- */
.sb{ position:fixed; top:0; left:0; bottom:0; width:var(--sb-w); background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; z-index:30; }
.sb__brand{ display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); }
.sb__mark{ width:24px; height:24px; border-radius:5px; flex:none; background:var(--brand); display:grid; place-items:center; }
.sb__mark svg{ width:15px; height:15px; color:#fff; }
.sb__name{ font-weight:700; font-size:14px; letter-spacing:-.01em; }
.sb__name small{ display:block; font-family:var(--mono); font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:400; margin-top:1px; }
.nav{ padding:6px; flex:1; overflow-y:auto; }
.nav__g{ font-family:var(--mono); font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); padding:12px 8px 4px; }
.nav__i{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:5px; color:var(--ink-2); font-weight:500; font-size:13px; cursor:pointer; border-left:2px solid transparent; }
.nav__i:hover{ background:var(--surface-2); color:var(--ink); text-decoration:none; }
.nav__i.on{ color:var(--brand); background:var(--brand-050); border-left-color:var(--brand); font-weight:600; }
.nav__i svg{ width:15px; height:15px; opacity:.7; flex:none; }
.nav__i .n{ margin-left:auto; font-family:var(--mono); font-size:.68rem; color:var(--ink-3); }
.sb__foot{ padding:8px 14px; border-top:1px solid var(--line); font-family:var(--mono); font-size:.6rem; color:var(--faint); }

/* ---------- topbar ---------- */
.top{ position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; padding:0 20px; height:44px; }
.top__t{ font-weight:600; font-size:14px; }
.top__sys{ font-family:var(--mono); font-size:.72rem; color:var(--ink-3); display:flex; gap:14px; }
.top__sys b{ color:var(--ink-2); font-weight:500; }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.seg button{ border:0; background:var(--surface); font-family:var(--mono); font-size:.68rem; color:var(--ink-2); padding:4px 8px; cursor:pointer; }
.seg button.on{ background:var(--brand); color:#fff; }
.top input.search{ border:1px solid var(--line); border-radius:6px; padding:5px 9px; font-family:var(--body); font-size:12px; outline:none; width:200px; background:var(--surface-2); }
.top input.search:focus{ border-color:var(--brand); }
.avatar{ width:26px; height:26px; border-radius:999px; background:var(--brand); color:#fff; display:grid; place-items:center; font-weight:600; font-size:11px; }

/* ---------- page header (terse) ---------- */
.ph{ display:flex; align-items:baseline; gap:12px; margin-bottom:12px; }
.ph h1{ font-size:16px; font-weight:700; margin:0; letter-spacing:-.01em; }
.ph .sub{ font-size:12px; color:var(--ink-3); }
.ph .spacer{ flex:1; }

/* ---------- status strip (вместо крупных KPI) ---------- */
.strip{ display:flex; flex-wrap:wrap; gap:0; border:1px solid var(--line); border-radius:8px; background:var(--surface); margin-bottom:var(--gap); overflow:hidden; }
.strip__i{ padding:9px 16px; border-right:1px solid var(--line-2); display:flex; align-items:baseline; gap:7px; }
.strip__i:last-child{ border-right:0; }
.strip__n{ font-family:var(--mono); font-weight:600; font-size:16px; }
.strip__l{ font-size:12px; color:var(--ink-3); }
.strip__i.b-pass .strip__n{ color:var(--pass); } .strip__i.b-fail .strip__n{ color:var(--fail); }
.strip__i.b-run .strip__n{ color:var(--info); } .strip__i.b-warn .strip__n{ color:var(--warn); }

/* ---------- panel ---------- */
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:8px; }
.panel__h{ display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line-2); }
.panel__b{ padding:12px; }
.sec{ font-family:var(--mono); font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); font-weight:600; }
.grid{ display:grid; gap:var(--gap); }

/* ---------- tables (главный элемент) ---------- */
.tw{ overflow-x:auto; }
table.t{ width:100%; border-collapse:collapse; font-size:13px; }
.t th{ text-align:left; font-weight:600; color:var(--ink-3); font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; position:sticky; top:0; background:var(--surface-2); user-select:none; }
.t th.s{ cursor:pointer; } .t th.s:hover{ color:var(--ink); }
.t td{ padding:0 10px; height:var(--row); border-bottom:1px solid var(--line-2); vertical-align:middle; white-space:nowrap; }
.t tbody tr:hover{ background:var(--surface-2); }
.t tr.clk{ cursor:pointer; }
.t .id{ font-family:var(--mono); font-size:12px; }
.t .num{ text-align:right; font-family:var(--mono); }
.t .empty{ padding:24px; text-align:center; color:var(--ink-3); height:auto; }
.t--fixed td{ white-space:normal; }
.chk{ width:14px; height:14px; accent-color:var(--brand); cursor:pointer; vertical-align:middle; }

/* ---------- status tags (flat) ---------- */
.st{ font-family:var(--mono); font-size:11px; font-weight:500; padding:1px 6px; border-radius:3px; white-space:nowrap; }
.st--pass{ color:var(--pass); background:var(--pass-bg); }
.st--fail{ color:var(--fail); background:var(--fail-bg); }
.st--warn{ color:var(--warn); background:var(--warn-bg); }
.st--run{ color:var(--info); background:var(--info-bg); }
.st--queue{ color:var(--queued); background:var(--queued-bg); }
.st--done{ color:var(--pass); background:var(--pass-bg); }
.st--muted{ color:var(--ink-2); background:var(--line-2); }
.st--high{ color:var(--risk-high); background:var(--risk-high-bg); }
.st--med{ color:var(--risk-med); background:var(--risk-med-bg); }
.st--low{ color:var(--risk-low); background:var(--risk-low-bg); }
.dot{ display:inline-block; width:6px; height:6px; border-radius:999px; vertical-align:middle; margin-right:5px; }

/* ---------- buttons ---------- */
.btn{ display:inline-flex; align-items:center; gap:6px; font-family:var(--body); font-weight:500; font-size:12px; padding:5px 10px; border-radius:6px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; }
.btn:hover{ background:var(--surface-2); text-decoration:none; }
.btn svg{ width:14px; height:14px; }
.btn--pri{ background:var(--brand); border-color:var(--brand); color:#fff; }
.btn--pri:hover{ background:var(--brand-700); }
.btn--sm{ padding:3px 8px; font-size:11px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

/* ---------- dotted-leader kv (вывод анализа) ---------- */
.leads{ display:flex; flex-direction:column; }
.lead{ display:flex; align-items:baseline; font-size:13px; padding:3px 0; }
body.dense .lead{ padding:1.5px 0; }
.lead .k{ color:var(--ink-2); }
.lead .d{ flex:1; border-bottom:1px dotted var(--line); margin:0 7px; transform:translateY(-3px); }
.lead .v{ font-family:var(--mono); font-weight:500; }
.lead .v.pass{ color:var(--pass); } .lead .v.fail{ color:var(--fail); }

/* ---------- meta grid (LIMS header) ---------- */
.lims-head{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:10px 14px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
.lims-head .id{ font-family:var(--mono); font-size:16px; font-weight:600; }
.lims-head .m{ font-family:var(--mono); font-size:12px; color:var(--ink-2); }
.kvcols{ display:grid; grid-template-columns:repeat(4,1fr); gap:4px 22px; }
.kvcols .k{ color:var(--ink-3); font-size:11px; }
.kvcols .v{ font-family:var(--mono); font-size:12.5px; }
.kvrow{ display:grid; grid-template-columns:130px 1fr; gap:2px 10px; }

/* ---------- pipeline steps (compact) ---------- */
.steps2{ display:flex; flex-direction:column; }
.step2{ display:flex; align-items:center; gap:10px; height:26px; border-bottom:1px solid var(--line-2); font-size:12.5px; }
.step2:last-child{ border-bottom:0; }
.step2 .mk{ width:14px; text-align:center; font-family:var(--mono); font-size:11px; }
.step2 .mk.done{ color:var(--pass); } .step2 .mk.run{ color:var(--info); } .step2 .mk.err{ color:var(--fail); } .step2 .mk.wait{ color:var(--faint); }
.step2 .nm{ flex:1; }
.step2 .tm{ font-family:var(--mono); font-size:11px; color:var(--ink-3); }
.step2 .bar{ height:4px; width:120px; background:var(--line-2); border-radius:2px; overflow:hidden; }
.step2 .bar i{ display:block; height:100%; background:var(--info); }

/* ---------- localization mini-bars ---------- */
.loc{ display:grid; grid-template-columns:150px 1fr 42px; align-items:center; gap:8px; font-size:12.5px; padding:2px 0; }
.loc .t{ height:6px; background:var(--line-2); border-radius:2px; overflow:hidden; }
.loc .t i{ display:block; height:100%; background:var(--ink-3); }
.loc.top .t i{ background:var(--brand); } .loc.top .nm{ font-weight:600; }
.loc .vv{ font-family:var(--mono); text-align:right; color:var(--ink-2); }

/* ---------- score inline ---------- */
.score-big{ font-family:var(--mono); font-size:30px; font-weight:600; letter-spacing:-.02em; }
.score-big.high{ color:var(--risk-high); } .score-big.medium{ color:var(--risk-med); } .score-big.low{ color:var(--risk-low); }

/* ---------- files list ---------- */
.files{ display:flex; flex-direction:column; }
.file{ display:flex; align-items:center; gap:8px; height:28px; border-bottom:1px solid var(--line-2); font-family:var(--mono); font-size:12px; }
.file:last-child{ border-bottom:0; }
.file .fn{ flex:1; } .file .fz{ color:var(--ink-3); } .file a{ color:var(--brand); cursor:pointer; }

/* ---------- collapsible ---------- */
details.dd > summary{ list-style:none; cursor:pointer; font-family:var(--mono); font-size:.72rem; color:var(--brand); padding:4px 0; user-select:none; display:flex; align-items:center; gap:6px; }
details.dd > summary::-webkit-details-marker{ display:none; }
details.dd > summary::before{ content:"▸"; color:var(--ink-3); }
details.dd[open] > summary::before{ content:"▾"; }

/* ---------- heatmap (сохраняем — понравилась) ---------- */
.heatmap{ overflow-x:auto; padding-bottom:4px; }
.heatmap__inner{ display:inline-block; }
.hm-row{ display:flex; align-items:center; }
.hm-label{ width:80px; flex:none; font-size:12px; text-align:right; padding-right:10px; color:var(--ink-2); font-family:var(--mono); }
.hm-label.strong{ font-weight:600; color:var(--ink); }
.hm-cell{ width:12px; height:18px; flex:none; }
.hm-scale{ display:flex; align-items:center; gap:8px; margin-top:8px; font-size:11px; color:var(--ink-3); font-family:var(--mono); }
.hm-scale__bar{ width:140px; height:8px; border-radius:2px; background:linear-gradient(90deg,var(--hm-0),var(--hm-mid),var(--hm-1)); }

/* ---------- alerts ---------- */
.alert{ display:flex; align-items:center; gap:8px; padding:6px 10px; border-bottom:1px solid var(--line-2); font-size:12.5px; }
.alert:last-child{ border-bottom:0; }
.alert svg{ width:14px; height:14px; flex:none; }

/* ---------- feedback (compact) ---------- */
.fb-opts{ display:flex; gap:8px; }
.fb-opt{ border:1px solid var(--line); border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; }
.fb-opt.on-y{ border-color:var(--pass); color:var(--pass); background:var(--pass-bg); }
.fb-opt.on-n{ border-color:var(--fail); color:var(--fail); background:var(--fail-bg); }
textarea.ta{ width:100%; border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-family:var(--body); font-size:12px; resize:vertical; min-height:48px; outline:none; }
select.sel{ border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:12px; background:var(--surface); outline:none; }

/* ---------- toast ---------- */
.toast-host{ position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:100; }
.toast{ background:var(--ink); color:#fff; padding:8px 12px; border-radius:6px; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,.18); }

.live{ display:inline-block; width:6px; height:6px; border-radius:999px; background:var(--pass); margin-right:5px; animation:pl 1.6s infinite; }
@keyframes pl{ 0%,100%{opacity:1} 50%{opacity:.35} }

@media (max-width:900px){ .kvcols{ grid-template-columns:repeat(2,1fr); } }

/* ---- стили заключения ---- */

  /* ============ Заключение — бланк лаборатории (Genomed letterhead + Galleri-контент) ============ */
  .rp-toolbar{ max-width:210mm; margin:0 auto 14px; }
  .doc{
    width:210mm; min-height:297mm; margin:0 auto; background:#fff;
    box-shadow:var(--shadow-lg); position:relative; overflow:hidden;
    font-family:var(--body); color:#20242b; font-size:9.6px; padding:10mm 15mm 8mm;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .doc *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }

  /* ---- шапка Genomed ---- */
  .gm-head{ display:grid; grid-template-columns:132px 1fr auto; gap:14px; align-items:center; }
  .gm-logo svg{ width:190px; height:auto; display:block; }
  .gm-logo-img{ height:52px; width:auto; display:block; }
  .gm-org .gm-reg{ display:flex; gap:16px; font-family:var(--mono); font-size:7.6px; color:#5a6b7b; }
  .gm-lab{ font-family:var(--disp); font-weight:800; font-size:13px; color:#155a9e; letter-spacing:.01em; margin:4px 0 3px; text-align:center; white-space:nowrap; }
  .gm-addr{ font-size:8.2px; color:#6b7280; }
  .gm-contacts{ font-size:7.9px; color:#4a5a68; display:flex; flex-direction:column; gap:2.5px; }
  .gm-contacts div{ display:flex; align-items:center; gap:6px; justify-content:flex-end; white-space:nowrap; }
  .gm-contacts svg{ width:11px; height:11px; color:#1a86c8; flex:none; }
  .gm-rule{ height:2px; background:#155a9e; border:0; margin:7px 0 0; }
  .gm-rule2{ height:.6px; background:#9cc3e4; border:0; margin:1.5px 0 0; }

  /* ---- заголовок ---- */
  .rp-titleblock{ text-align:center; margin:5mm 0 4mm; }
  .rp-title{ font-family:var(--disp); font-weight:800; font-size:18px; letter-spacing:.04em; color:#12202b; }
  .rp-subtitle{ font-size:10px; color:#5a6b7b; margin-top:3px; }
  .rp-subtitle b{ color:var(--brand); font-weight:700; }

  /* ---- реквизиты образца ---- */
  .rp-info{ display:grid; grid-template-columns:1fr 1.25fr 1fr; gap:22px; padding:11px 0; border-top:1px solid #dfe6ec; border-bottom:1px solid #dfe6ec; }
  .rp-info h4{ font-family:var(--disp); font-weight:700; font-size:10.5px; margin:0 0 6px; color:#155a9e; }
  .rp-info dl{ display:grid; grid-template-columns:auto 1fr; gap:3px 10px; margin:0; font-size:9px; }
  .rp-info dt{ color:#8a99a8; font-weight:600; white-space:nowrap; }
  .rp-info dd{ margin:0; color:#20242b; }

  /* реквизиты в стиле бланка Геномед (сжатый вариант) */
  .rp-gm-info{ display:grid; grid-template-columns:1fr 1fr; gap:2px 30px; padding:11px 0; border-top:1px solid #dfe6ec; border-bottom:1px solid #dfe6ec; font-size:9.6px; }
  .rp-gm-info .r{ display:flex; gap:7px; padding:2.5px 0; align-items:baseline; }
  .rp-gm-info .r b{ color:#12202b; font-weight:700; white-space:nowrap; }
  .rp-gm-info .r span{ color:#20242b; }

  /* ---- секции с боковым язычком ---- */
  .rp-sec{ display:flex; gap:0; margin-top:4.5mm; }
  .rp-sec__tab{ width:24px; flex:none; color:#fff; writing-mode:vertical-rl; transform:rotate(180deg);
    text-align:center; font-family:var(--disp); font-weight:800; letter-spacing:.14em; font-size:9.5px; text-transform:uppercase;
    display:flex; align-items:center; justify-content:center; padding:12px 0; border-radius:3px; }
  .rp-sec__body{ flex:1; padding-left:16px; min-width:0; }

  .resultbox{ border:1.6px solid var(--det); border-radius:5px; padding:15px 20px 14px; position:relative; margin-top:8px; display:flex; gap:18px; align-items:flex-start; }
  .resultbox__legend{ position:absolute; top:-8px; left:18px; background:#fff; padding:0 8px; color:var(--det); font-family:var(--disp); font-weight:800; font-size:11.5px; }
  .result-icon{ width:52px; height:52px; flex:none; border-radius:50%; background:var(--det); color:#fff; display:grid; place-items:center; font-family:var(--disp); font-weight:900; font-size:29px; line-height:1; }
  .result-icon svg{ width:27px; height:27px; }
  .result-h{ font-family:var(--disp); font-weight:800; font-size:19px; letter-spacing:-.01em; color:var(--det); line-height:1.08; margin:1px 0 6px; }
  .result-p{ font-size:9.6px; line-height:1.55; color:#2f3944; margin:0; text-align:justify; }
  .result-p b{ color:#12202b; }

  .rp-two{ display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:14px; }
  .rp-two h5{ display:flex; align-items:center; gap:7px; font-family:var(--disp); font-weight:800; font-size:11.5px; color:var(--det); margin:0 0 5px; }
  .rp-two h5 svg{ width:15px; height:15px; }
  .rp-two p{ margin:0; font-size:9.1px; line-height:1.5; color:#2f3944; text-align:justify; }
  .rp-two p b{ color:#12202b; }

  .pred-h{ font-family:var(--disp); font-weight:800; font-size:14px; color:var(--pred); margin:0 0 3px; }
  .pred-rule{ height:1.5px; background:var(--pred); opacity:.4; border:0; margin:0 0 11px; }
  .pred-grid{ display:grid; grid-template-columns:210px 1fr; gap:22px; align-items:start; }
  .cso-card{ border:1.4px solid #d7d3ec; border-radius:5px; overflow:hidden; }
  .cso-card__hd{ background:var(--pred); color:#fff; font-family:var(--disp); font-weight:700; font-size:9px; padding:6px 12px; letter-spacing:.04em; text-transform:uppercase; }
  .cso-card__bd{ padding:12px 13px; }
  .cso-label{ font-family:var(--mono); font-size:7.2px; letter-spacing:.1em; text-transform:uppercase; color:var(--pred); font-weight:600; }
  .cso-name{ font-family:var(--disp); font-weight:800; font-size:14.5px; color:#20242b; line-height:1.05; margin:2px 0 7px; }

<body>
<div class="layout">
  <aside class="sb" id="sb"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="content" id="view"></main>
  </div>

<script>
/* ============================================================
   EpiPrint — мок-данные прототипа (детерминированные).
   Ничего из этого не является реальными медицинскими данными.
   ============================================================ */

// --- детерминированный PRNG (mulberry32) ---
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function rngFor(s){ return mulberry32(hashStr(s)); }
function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }
function between(rng, a, b, dp=0){ const v=a+rng()*(b-a); return dp?+v.toFixed(dp):Math.round(v); }

// --- справочники ---
const CANCER_TYPES = [
  { key:'breast',     label:'Молочная железа' },
  { key:'colorectal', label:'Колоректальный' },
  { key:'prostate',   label:'Предстательная железа' },
  { key:'lung',       label:'Лёгкое' },
  { key:'liver',      label:'Печень' },
  { key:'stomach',    label:'Желудок' },
  { key:'pancreas',   label:'Поджелудочная железа' },
  { key:'esophagus',  label:'Пищевод' },
];
const KITS = [
  { key:'vazyme', label:'Vazyme',       method:'WGBS' },
  { key:'rasel',  label:'Rasel',        method:'WGBS' },
  { key:'brock',  label:'Burning Rock', method:'Таргетный (ELSA-seq)' },
];
const REF = 'hg38';

// стадии пайплайна — по реальному status.log (Nanodigm) + downstream
const PIPELINE_STAGES = [
  'fastp',
  'Выравнивание (bwa-meth)',
  'MarkDuplicates',
  'CollectMultipleMetrics',
  'CollectWgsMetrics',
  'Uniformity',
  'MethylDackel',
  'Cytosine QC',
  'Build JSON',
  'Классификатор',
  'Формирование заключения',
];

// панель маркерных регионов метилирования, сгруппированная по типу рака
// (реальные гены-маркеры cfDNA-метилирования, позиции — демо)
const _MK = {
  breast:     ['RASSF1A','GSTP1','CDH13','RARB','BRCA1','SFRP1'],
  colorectal: ['SEPT9','BCAT1','NDRG4','SFRP2','TFPI2','VIM','APC'],
  prostate:   ['GSTP1','APC','RASSF1A','PTGS2','RARB','TIG1'],
  lung:       ['SHOX2','RASSF1A','PTGER4','HOXA7','SCT','CDO1'],
  liver:      ['BMPR1A','HOXA10','SEPT9','RASSF1A','APC'],
  stomach:    ['RPRM','RNF180','CDH1','TFPI2','MLH1'],
  pancreas:   ['BNC1','ADAMTS1','SFRP2','NPTX2','CDKN2A'],
  esophagus:  ['SFRP1','TAC1','HPP1','CDH13','APC'],
};
const MARKER_PANEL = CANCER_TYPES.flatMap(ct => (_MK[ct.key]||[]).map((g,i)=>{
  const r = rngFor(ct.key+'_'+g+'_'+i);
  return { gene:g, cancer:ct.key, pos: between(r, 1000000, 199000000) };
}));

// --- генерация выборки образцов ---
const FEMALE_CODES = ['SII','LNV','TRI','TIS','BAS','ESR','KMA','ONA'];
const MALE_CODES   = ['RAM','GEL','ARV','ZVP','URM','PNI','SIV','DKO'];
const SURNAMES = ['Соколов','Кузнецов','Попов','Лебедев','Козлов','Новиков','Морозов','Волков','Соловьёв','Васильев','Зайцев','Павлов','Семёнов','Голубев','Виноградов','Богданов','Воробьёв','Фёдоров','Михайлов','Беляев','Тарасов','Комаров','Орлов','Киселёв','Макаров','Андреев','Ковалёв','Ильин','Гусев','Титов'];
const INITS = ['А','Б','В','Г','Д','Е','И','К','Л','М','Н','О','П','Р','С','Т','Ю','Я'];
function makeFio(seed, isFemale){ const r=rngFor(seed+'_fio'); let sur=pick(r,SURNAMES); if(isFemale) sur+='а'; return `${sur} ${pick(r,INITS)}. ${pick(r,INITS)}.`; }

// QC-метрики по формату реального qc.json (Nanodigm): conversion_rate, coverage,
// cpg (mean_cov / pct_5x / mbias), duplicates, insert_size, q30, gc, strand_ratio.
function makeQC(rng, kit){
  let conversion = between(rng, 99.1, 99.85, 2);   // conversion_rate
  let meanDepth  = between(rng, 12, 22, 1);         // coverage.mean
  let uniformity = between(rng, 96, 99.5, 1);       // coverage.uniformity
  let cov10      = between(rng, 72, 92, 1);         // coverage.pct_10x
  let cpgMean    = between(rng, 4.6, 8, 2);         // cpg.mean_cov
  let cpgCov     = between(rng, 46, 66, 1);         // cpg.pct_5x
  let mbias      = between(rng, -0.06, 0.06, 3);    // cpg.mbias_diff
  let dup        = between(rng, 4, 13, 1);          // duplicates
  let insert     = between(rng, 135, 155);          // insert_size.median
  let mapped     = between(rng, 95.5, 99.4, 1);     // доля картированных
  let q30        = between(rng, 92.5, 96, 1);       // reads.q30_rate
  const gc       = between(rng, 19, 24, 1);         // gc_content (низкий из-за бисульфита)
  let strand     = between(rng, 0.985, 1.02, 3);    // strand_ratio
  const tumorFrac= between(rng, 0.3, 9.5, 1);

  // ~20% образцов — одна метрика вне порога (реализм потока)
  if (rng() < 0.20){
    const w = Math.floor(rng()*5);
    if (w===0) conversion = between(rng, 98.3, 98.9, 2);
    else if (w===1) uniformity = between(rng, 88, 95.5, 1);
    else if (w===2) cpgCov = between(rng, 32, 44, 1);
    else if (w===3) q30 = between(rng, 86, 91.5, 1);
    else dup = between(rng, 15, 24, 1);
  }

  const metrics = [
    { key:'conversion', name:'Эффективность бисульфитной конверсии', unit:'%',  value:conversion, threshold:'≥ 99.0', pass: conversion>=99.0 },
    { key:'meanDepth',  name:'Средняя глубина покрытия', unit:'×', value:meanDepth, threshold:'≥ 10', pass: meanDepth>=10 },
    { key:'uniformity', name:'Равномерность покрытия', unit:'%', value:uniformity, threshold:'≥ 90', pass: uniformity>=90 },
    { key:'cov10',      name:'Доля оснований ≥ 10×', unit:'%', value:cov10, threshold:'≥ 70', pass: cov10>=70 },
    { key:'cpgMean',    name:'Среднее покрытие CpG', unit:'×', value:cpgMean, threshold:'≥ 4', pass: cpgMean>=4 },
    { key:'cpgCov',     name:'Доля CpG с покрытием ≥ 5×', unit:'%', value:cpgCov, threshold:'≥ 45', pass: cpgCov>=45 },
    { key:'mbias',      name:'M-bias, разница', unit:'', value:mbias, threshold:'|≤ 0.1|', pass: Math.abs(mbias)<=0.1 },
    { key:'dup',        name:'Уровень дупликатов', unit:'%', value:dup, threshold:'≤ 15', pass: dup<=15 },
    { key:'insert',     name:'Размер вставки, медиана', unit:'bp', value:insert, threshold:'120–160', pass: insert>=120&&insert<=160 },
    { key:'mapped',     name:'Доля картированных ридов', unit:'%', value:mapped, threshold:'≥ 95', pass: mapped>=95 },
    { key:'q30',        name:'Доля оснований Q30', unit:'%', value:q30, threshold:'≥ 92', pass: q30>=92 },
    { key:'gc',         name:'GC-состав', unit:'%', value:gc, threshold:'справочно', pass:true },
    { key:'strand',     name:'Соотношение цепей', unit:'', value:strand, threshold:'0.9–1.1', pass: strand>=0.9&&strand<=1.1 },
    { key:'tumorFrac',  name:'Оценка опухолевой фракции', unit:'%', value:tumorFrac, threshold:'справочно', pass:true },
  ];
  const failed = metrics.filter(m=>!m.pass && m.threshold!=='справочно').map(m=>m.name);
  return { metrics, failed, verdict: failed.length? 'Fail':'Pass' };
}

function makeScore(rng, forcedCancer){
  const isCancer = forcedCancer!==undefined ? forcedCancer : rng()>0.55;
  let cancerProb;
  if (isCancer) cancerProb = between(rng, 0.62, 0.94, 3);
  else          cancerProb = between(rng, 0.02, 0.34, 3);

  // локализация: один доминирующий тип + фон
  const weights = CANCER_TYPES.map(()=> rng());
  const domIdx = Math.floor(rng()*CANCER_TYPES.length);
  weights[domIdx] += isCancer ? 2.4 : 0.4;
  const sum = weights.reduce((a,b)=>a+b,0);
  const localization = {};
  CANCER_TYPES.forEach((t,i)=> localization[t.key] = +(weights[i]/sum).toFixed(3));

  let risk = 'low';
  if (cancerProb>=0.7) risk='high'; else if (cancerProb>=0.45) risk='medium';
  return { cancerProb, risk, localization, topType: CANCER_TYPES[domIdx].key };
}

// heatmap по панели маркеров (регион × [Образец, Норма, Опухоль]).
// Образец тяготеет к норме; при онкопроцессе регионы соответствующей
// локализации сильнее сдвигаются к «опухолевому» паттерну.
function makeHeatmap(seqId, isCancer, topType){
  const rng = rngFor(seqId+'_hm');
  const regions = MARKER_PANEL;
  const N = regions.length;
  const norm = [], tumor = [], sample = [], loci = [];
  regions.forEach((reg, i)=>{
    const n = +(rng()*0.32).toFixed(3);           // норма — низкое
    const t = +(0.55 + rng()*0.45).toFixed(3);    // опухоль — высокое
    let shift = rng()*0.10;
    if (isCancer) shift = (reg.cancer===topType) ? (0.40 + rng()*0.40) : (0.05 + rng()*0.22);
    const s = +Math.min(1, n*(1-shift) + t*shift).toFixed(3);
    norm.push(n); tumor.push(t); sample.push(s);
    loci.push({ gene:reg.gene, pos:reg.pos, cancer:reg.cancer, sample:s, norm:n, delta:+(s-n).toFixed(3) });
  });
  const topLoci = [...loci].sort((a,b)=> b.delta - a.delta).slice(0, 8);
  return { N, regions, topLoci, rows:[
    { label:'Образец', strong:true, values:sample },
    { label:'Норма', values:norm },
    { label:'Опухоль', values:tumor },
  ]};
}

// --- сборка образцов ---
function buildSamples(){
  const runs = ['R2026-018','R2026-019','R2026-020','R2026-021'];
  const statuses = [
    // распределение статусов по образцам
    'done','done','done','done','done','done','done','done','done','done','done','done',
    'done','done','processing','processing','processing','queued','queued','queued','error','done','done','done'
  ];
  const out = [];
  for (let i=0;i<statuses.length;i++){
    const status = statuses[i];
    const rng = rngFor('sample'+i);
    const isFemale = rng()>0.5;
    const codeSet = isFemale? FEMALE_CODES: MALE_CODES;
    const pcode = pick(rng, codeSet) + String(between(rng,10,31)).padStart(2,'0') + String(between(rng,1,12)).padStart(2,'0') + String(between(rng,40,99));
    const kit = KITS[i % 3];
    const run = runs[i % runs.length];
    const idx = 30 + i;
    const seqId = `EP_${run.slice(5)}_${String(idx).padStart(2,'0')}_${pcode}`;
    const patientNo = 'P-' + String(hashStr(seqId)%900000+100000);
    const day = 3 + Math.floor(i/6);
    const date = `2026-07-0${day}`;

    const done = status==='done';
    const qc = makeQC(rngFor(seqId+'_qc'), kit);
    const sc = done ? makeScore(rngFor(seqId+'_sc')) : null;
    const isCancer = sc ? sc.cancerProb>0.5 : (rng()>0.5);

    // обратная связь — только для части завершённых
    let feedback = { confirmed:null, note:'', date:'', locConfirmed:'' };
    if (done && i%4===0 && sc){
      const agree = sc.cancerProb>0.5 ? rng()>0.25 : rng()>0.15;
      feedback = {
        confirmed: sc.cancerProb>0.5 ? (agree?'yes':'no') : (agree?'no':'yes'),
        note: '',
        date: `2026-07-0${day+1}`,
        locConfirmed: (sc.cancerProb>0.5 && agree) ? sc.topType : ''
      };
    }

    out.push({
      i, id: 5100+i, seqId, run, ref:REF, kit,
      patientCode: pcode, patientNo, fio: makeFio(seqId, isFemale), sex: isFemale?'Ж':'М', age: between(rng,38,74),
      contractor: pick(rng, ['ООО «Медикал Поинт»','АО «ЕМЦ»','КДЛ ДОМОДЕДОВО','Внутр. валидация','ООО «Юни Медика»']),
      date, status,
      qc, score: sc, isCancer,
      heatmap: makeHeatmap(seqId, isCancer, sc ? sc.topType : null),
      feedback,
    });
  }
  return out;
}

const SAMPLES = buildSamples();
const sampleById = id => SAMPLES.find(s=> String(s.id)===String(id));

// --- очередь (из образцов + тайминги/стадии) ---
function buildQueue(){
  return SAMPLES.filter(s=> s.status!=='queued' || true).map(s=>{
    const rng = rngFor(s.seqId+'_q');
    let stageIdx, stageStatuses;
    if (s.status==='done'){ stageIdx = PIPELINE_STAGES.length; }
    else if (s.status==='processing'){ stageIdx = between(rng,2,7); }
    else if (s.status==='error'){ stageIdx = between(rng,3,6); }
    else { stageIdx = 0; }

    const created = `07 июл. ${String(between(rng,9,17)).padStart(2,'0')}:${String(between(rng,10,59)).padStart(2,'0')}`;
    const startAt = s.status==='queued'? '—' : created.replace(/(\d+):(\d+)/,(m,h,mm)=>`${h}:${String((+mm+2)%60).padStart(2,'0')}`);
    const endAt   = s.status==='done'? created.replace(/(\d+):(\d+)/,(m,h,mm)=>`${(+h+1)}:${String((+mm+5)%60).padStart(2,'0')}`) : '—';

    const stages = PIPELINE_STAGES.map((name,idx)=>{
      let st='wait';
      if (s.status==='error' && idx===stageIdx) st='error';
      else if (idx<stageIdx) st='done';
      else if (idx===stageIdx && s.status==='processing') st='active';
      return { name, status: st, dur: idx<stageIdx? `${between(rngFor(s.seqId+idx),1,9)}м ${between(rngFor(s.seqId+idx+'s'),1,59)}с` : '' };
    });
    return { ...s, stageIdx, stages, created, startAt, endAt,
      progress: Math.round(stageIdx/PIPELINE_STAGES.length*100) };
  }).sort((a,b)=> b.id-a.id);
}
const QUEUE = buildQueue();

// --- хранилище (загрузки → образцы-папки) ---
function buildStorage(){
  const runs = ['R2026-021','R2026-020','R2026-019','R2026-018'];
  return runs.map((run, ri)=>{
    const rng = rngFor(run+'_st');
    const samplesInRun = SAMPLES.filter(s=> s.run===run);
    const files = samplesInRun.map(s=>({
      basename: s.seqId,
      sizeGb: between(rngFor(s.seqId+'_sz'), 3.2, 9.8, 1),
      kit: s.kit.label,
      ready: true,
      launched: s.status!=='queued',
      status: s.status,
      id: s.id,
    }));
    // пара «сырых, ещё не запущенных» папок в самой свежей загрузке
    if (ri===0){
      for (let k=0;k<2;k++){
        const sid = `EP_021_${90+k}_NEW${between(rng,100,999)}`;
        files.unshift({ basename:sid, sizeGb:between(rng,3.5,8.5,1), kit:'Vazyme', ready:true, launched:false, status:'new', id:'new'+k });
      }
    }
    return {
      run, ref:REF,
      created: `0${4-ri} июл. 2026, ${String(8+ri).padStart(2,'0')}:${String(between(rng,10,55)).padStart(2,'0')}`,
      files,
    };
  });
}
const STORAGE = buildStorage();

// --- мониторинг монтирований (Главная) ---
const MOUNTS = [
  { name:'storage-38 → srv-72',  path:'/mnt/storage38/epiprint',    status:'ok',   note:'чтение' },
  { name:'srv-72 → srv-60',      path:'/mnt/mirror60/epiprint',     status:'ok',   note:'зеркало' },
  { name:'srv-60 → web',         path:'/var/www/epiprint/storage',  status:'ok',   note:'веб' },
  { name:'cluster-BS → srv-72',  path:'/mnt/cluster/results',       status:'warn', note:'высокая нагрузка' },
  { name:'backup-41',            path:'/mnt/backup41/epiprint',     status:'ok',   note:'резерв' },
];

// --- агрегаты для дашборда ---
const STATS = (()=>{
  const done = SAMPLES.filter(s=>s.status==='done');
  const proc = SAMPLES.filter(s=>s.status==='processing');
  const q    = SAMPLES.filter(s=>s.status==='queued');
  const err  = SAMPLES.filter(s=>s.status==='error');
  const qcPass = done.filter(s=>s.qc.verdict==='Pass').length;
  const highRisk = done.filter(s=>s.score && s.score.risk==='high').length;
  const withFb = SAMPLES.filter(s=>s.feedback.confirmed).length;
  return {
    total: SAMPLES.length, done: done.length, processing: proc.length, queued: q.length, error: err.length,
    qcPassRate: done.length? Math.round(qcPass/done.length*100):0,
    highRisk, withFb,
    throughput7d: [3,5,4,6,2,5,4], // образцов/день за неделю
  };
})();

const CURRENT_USER = { initials:'ВЮ', name:'Варвара Юхина', role:'Биоинформатик / администратор' };

</script>

/* ---------- навигация ---------- */

];

function renderShell(){
  const active = document.body.dataset.page;
  const newCount = STORAGE.reduce((a,r)=> a + r.files.filter(f=>!f.launched).length, 0);
  const activeCount = SAMPLES.filter(s=> s.status==='processing'||s.status==='queued').length;

  const nav = NAV.map(n=>{
    if (n.group) return `<div class="nav__group">${n.group}</div>`;
    let badge = '';
    if (n.key==='storage' && newCount) badge = `<span class="nav__badge">${newCount}</span>`;
    if (n.key==='queue' && activeCount) badge = `<span class="nav__badge">${activeCount}</span>`;
    return `<a class="nav__item ${active===n.key?'is-active':''}" href="${n.href}">${icon(n.icon)}<span>${n.label}</span>${badge}</a>`;
  }).join('');

  const sb = document.getElementById('sidebar');
  if (sb) sb.innerHTML = `
    <div class="brand">
      <div class="brand__mark">${icon('fingerprint')}</div>
      <div><div class="brand__name">EpiPrint</div><div class="brand__sub">cfDNA Methylation</div></div>
    </div>
    <nav class="nav">${nav}</nav>
    <div class="sidebar__foot">Прототип · v0.1 · демо-данные</div>`;

  const tb = document.getElementById('topbar');
  if (tb){
    const title = tb.dataset.title || '';
    const crumb = tb.dataset.crumb ? `<span class="topbar__crumb">${tb.dataset.crumb}</span>` : '';
    tb.innerHTML = `
      <div class="topbar__title">${title}</div>${crumb}

      <label class="topbar__search">${icon('search')}<input placeholder="Поиск по Seq ID…" id="globalSearch"></label>

    if (gs) gs.addEventListener('keydown', e=>{ if(e.key==='Enter'&&gs.value.trim()){ location.href='samples.html?q='+encodeURIComponent(gs.value.trim()); }});

}

const STATUS_META = {
  done:      { cls:'done',   label:'Завершён' },

  queued:    { cls:'queued', label:'В очереди' },

};
function statusBadge(s){ const m=STATUS_META[s]||STATUS_META.new; return `<span class="badge badge--${m.cls}"><span class="dot"></span>${m.label}</span>`; }
function qcBadge(v){ return v==='Pass' ? `<span class="badge badge--pass">${icon('check')}Pass</span>` : `<span class="badge badge--fail">${icon('x')}Fail</span>`; }
const RISK_META = { high:{cls:'high',label:'Высокий риск'}, medium:{cls:'med',label:'Средний риск'}, low:{cls:'low',label:'Низкий риск'} };
function riskBadge(r){ const m=RISK_META[r]; return `<span class="badge badge--${m.cls}">${m.label}</span>`; }
function cancerLabel(key){ const t=CANCER_TYPES.find(t=>t.key===key); return t?t.label:'—'; }
function pct(v,dp=0){ return (v*100).toFixed(dp)+'%'; }

/* ---------- хитмап цвет: 0=синий … 1=красный ---------- */
function lerp(a,b,t){ return a+(b-a)*t; }
function heatColor(v){
  const c0=[44,111,179], cm=[244,242,238], c1=[192,57,43];
  let r,g,b;
  if (v<0.5){ const t=v/0.5; r=lerp(c0[0],cm[0],t); g=lerp(c0[1],cm[1],t); b=lerp(c0[2],cm[2],t); }
  else { const t=(v-0.5)/0.5; r=lerp(cm[0],c1[0],t); g=lerp(cm[1],c1[1],t); b=lerp(cm[2],c1[2],t); }
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}
function heatmapHtml(hm){
  const rows = hm.rows.map(row=>{
    const cells = row.values.map(v=>`<div class="hm-cell" style="background:${heatColor(v)}" title="${v.toFixed(2)}"></div>`).join('');
    return `<div class="hm-row"><div class="hm-label ${row.strong?'strong':''}">${row.label}</div>${cells}</div>`;
  }).join('');
  return `<div class="heatmap"><div class="heatmap__inner">${rows}</div></div>
    <div class="hm-scale"><span>0 · низкое</span><div class="hm-scale__bar"></div><span>1 · высокое</span>
    <span class="muted" style="margin-left:auto">${hm.N} маркерных регионов</span></div>`;
}

/* ---------- гейдж вероятности ---------- */
function gaugeHtml(prob, risk){
  const r=64, c=2*Math.PI*r, off=c*(1-prob);
  const col = risk==='high'?'var(--risk-high)':risk==='medium'?'var(--risk-med)':'var(--risk-low)';
  return `<div class="gauge"><svg width="150" height="150" viewBox="0 0 150 150">
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="13"/>
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
  </svg><div class="gauge__center"><div class="gauge__pct" style="color:${col}">${Math.round(prob*100)}%</div><div class="gauge__cap">онкопроцесс</div></div></div>`;
}

/* ---------- бары локализации ---------- */
function localizationBars(localization, topType){
  const entries = CANCER_TYPES.map(t=>({ ...t, v: localization[t.key] })).sort((a,b)=> b.v-a.v);
  return `<div class="locbars">` + entries.map((e,i)=>{
    const isTop = e.key===topType;
    const col = isTop ? 'var(--brand-600)' : 'var(--ink-3)';
    return `<div class="locbar ${isTop?'top':''}">
      <div class="locbar__name">${e.label}</div>
      <div class="locbar__track"><div class="locbar__fill" style="width:${Math.max(2,e.v*100).toFixed(0)}%;background:${col}"></div></div>
      <div class="locbar__val">${pct(e.v,1)}</div>
    </div>`;
  }).join('') + `</div>`;
}

/* ---------- тосты ---------- */
function toast(msg){
  let host = document.querySelector('.toast-host');
  if (!host){ host=document.createElement('div'); host.className='toast-host'; document.body.appendChild(host); }
  const t=document.createElement('div'); t.className='toast'; t.innerHTML=`${icon('circle-check')}<span>${msg}</span>`;
  host.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 3200);
}

/* ---------- утилиты ---------- */
function qs(name){ return new URLSearchParams(location.search).get(name); }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- локальное хранилище обратной связи (демо) ---------- */
const FB_KEY = 'epiprint_feedback';
function loadFeedback(){ try{ return JSON.parse(localStorage.getItem(FB_KEY)||'{}'); }catch(e){ return {}; } }
function saveFeedback(id, data){ const all=loadFeedback(); all[id]=data; localStorage.setItem(FB_KEY, JSON.stringify(all)); }
function getFeedback(sample){ const all=loadFeedback(); return all[sample.id] || sample.feedback; }

function buildReportDoc(s, variant){
  const compact = variant === 'compact';
  const sc = s.score, detected = sc.cancerProb > 0.5;
  const d = new Date(s.date+'T00:00:00');
  const fmtD = dt=>`${String(dt.getDate()).padStart(2,'0')}.${String(dt.getMonth()+1).padStart(2,'0')}.${dt.getFullYear()}`;
  const collect = new Date(d); collect.setDate(d.getDate()-3);
  const recv = new Date(d); recv.setDate(d.getDate()-2);
  const reportNo = 'EP-'+s.id+'/'+s.run.slice(2);
  const top2 = CANCER_TYPES.map(t=>({...t, v:sc.localization[t.key]})).sort((a,b)=>b.v-a.v).slice(0,2);
  const detColor = detected ? (sc.risk==='high' ? '#c0392b' : '#c8820a') : '#1a8a52';
  const riskWord = { high:'высокая', medium:'средняя', low:'низкая' }[sc.risk];

  const detectionText = detected
    ? `В образце свободно циркулирующей ДНК плазмы крови выявлен профиль метилирования, характерный для онкологического процесса. Расчётная вероятность наличия онкологического процесса — <b>${pct(sc.cancerProb)}</b>; категория риска — <b>${riskWord}</b>. Результат подлежит подтверждению методами клинического и инструментального обследования.`
    : `В образце свободно циркулирующей ДНК плазмы крови профиль метилирования, характерный для онкологического процесса, не выявлен. Расчётная вероятность наличия онкологического процесса — <b>${pct(sc.cancerProb)}</b>; категория риска — <b>${riskWord}</b>. Отрицательный результат не исключает наличия онкологического заболевания.`;

  // Интерпретация (в сжатом — с добавлением сути методики)
  let interpText = detected
    ? `Выявленный профиль метилирования ассоциирован с онкологическим процессом. Показано дообследование у профильного специалиста для верификации результата и установления окончательного диагноза.`
    : `Признаки онкологического процесса в исследованном образце не обнаружены. Рекомендовано продолжение планового скринингового наблюдения в соответствии с возрастом и факторами риска пациента.`;
  if (compact) interpText += ` Исследование выполнено методом анализа метилирования свободно циркулирующей ДНК плазмы крови (панель из ${s.heatmap.N} маркерных регионов, референсный геном GRCh38; секвенирование DNBSEQ/Illumina; контроль качества образца — ${s.qc.verdict==='Pass'?'пройден':'с замечаниями'}).`;

  // Ограничения интерпретации (в сжатом — с добавлением сути ограничений метода)
  let limitText = detected
    ? `Результат исследования не является установленным диагнозом и не может служить единственным основанием для его постановки. Окончательная интерпретация осуществляется лечащим врачом с учётом клинической картины и данных иных методов обследования.`
    : `Отрицательный результат не исключает наличия онкологического заболевания, в том числе локализаций, не входящих в исследуемую панель. Окончательная интерпретация осуществляется лечащим врачом с учётом клинической картины.`;
  if (compact) limitText += ` Исследование не заменяет стандартные методы обследования; диагностическая чувствительность снижается на ранних стадиях заболевания и при низкой доле опухолевой ДНК в образце; панель охватывает ограниченный перечень локализаций.`;

  // --- реквизиты образца: полный (тех.) vs сжатый (в стиле бланка Геномед) ---
  const infoFull = `
    <div class="rp-info">
      <div><h4>Пациент</h4><dl>
        <dt>Код</dt><dd>${s.patientCode}</dd>
        <dt>Индивидуальный №</dt><dd>${s.patientNo}</dd>
        <dt>Пол</dt><dd>${s.sex==='Ж'?'женский':'мужской'}</dd>
        <dt>Возраст</dt><dd>${s.age} лет</dd>
      </dl></div>
      <div><h4>Образец и метод</h4><dl>
        <dt>Идентификатор</dt><dd>${s.seqId}</dd>
        <dt>Биоматериал</dt><dd>плазма крови, cfDNA</dd>
        <dt>Метод · набор</dt><dd>${s.kit.method} · ${s.kit.label}</dd>
        <dt>Референсный геном</dt><dd>GRCh38 (${s.ref})</dd>
      </dl></div>
      <div><h4>Сроки исследования</h4><dl>
        <dt>Направитель</dt><dd style="font-family:var(--body)">${s.contractor}</dd>
        <dt>Забор материала</dt><dd>${fmtD(collect)}</dd>
        <dt>Поступление</dt><dd>${fmtD(recv)}</dd>
        <dt>Готовность</dt><dd>${fmtD(d)}</dd>
        <dt>Заключение №</dt><dd>${reportNo}</dd>
      </dl></div>
    </div>`;

  const infoCompact = `
    <div class="rp-gm-info">
      <div>
        <div class="r"><b>Номер договора:</b><span>Д-${s.id}/26</span></div>
        <div class="r"><b>Пациент:</b><span>${s.patientCode}</span></div>
        <div class="r"><b>Дата рождения · пол:</b><span>[дд.мм.гггг] · ${s.sex==='Ж'?'жен.':'муж.'}</span></div>
        <div class="r"><b>Вид биоматериала:</b><span>плазма крови (cfDNA)</span></div>
        <div class="r"><b>Вид исследования:</b><span>EpiPrint — метилирование cfDNA (MCED)</span></div>
      </div>
      <div>
        <div class="r"><b>Дата забора материала:</b><span>${fmtD(collect)}</span></div>
        <div class="r"><b>Поступление в лабораторию:</b><span>${fmtD(recv)}</span></div>
        <div class="r"><b>Дата готовности:</b><span>${fmtD(d)}</span></div>
        <div class="r"><b>Заключение №:</b><span>${reportNo}</span></div>
      </div>
    </div>`;

  const infoBlock = compact ? infoCompact : infoFull;

  const predictionBlock = detected ? `
    <div class="rp-sec">
      <div class="rp-sec__tab" style="background:var(--pred)">Локализация</div>
      <div class="rp-sec__body">
        <div class="pred-h">Предполагаемая локализация источника сигнала</div>
        <hr class="pred-rule">
        <div class="pred-grid">
          <div class="cso-card">
            <div class="cso-card__hd">Источник сигнала</div>
            <div class="cso-card__bd">
              <div class="cso-label">Наиболее вероятная локализация</div>
              <div class="cso-name">${top2[0].label}</div>
              <div class="cso-meter"><i style="width:100%"></i></div>
              <div class="cso-second">
                <div class="cso-label">Альтернативная локализация</div>
                <div class="cso-name" style="font-size:13px">${top2[1].label}</div>
                <div class="cso-meter"><i style="width:${Math.round(top2[1].v/top2[0].v*100)}%"></i></div>
              </div>
            </div>
          </div>
          <div class="pred-expl">
            <p>Предполагаемая локализация источника сигнала указывает ткань или орган, ассоциированные с выявленным профилем метилирования, и предназначена для определения приоритетного направления диагностического поиска.</p>
            <p>Протяжённость индикатора отражает степень соответствия профиля метилирования опухолям указанной локализации: большей протяжённости соответствует более высокая степень соответствия. Диагностическую оценку следует начинать с наиболее вероятной локализации.</p>
            <p class="it">Протяжённость индикатора не отражает вероятность наличия злокачественного новообразования и не заменяет топической диагностики.</p>
          </div>
        </div>
      </div>
    </div>`
  : `
    <div class="rp-sec">
      <div class="rp-sec__tab" style="background:var(--pred)">Локализация</div>
      <div class="rp-sec__body">
        <div class="pred-h">Локализация источника сигнала</div>
        <hr class="pred-rule">
        <p style="font-size:9.4px;color:#6b7280;line-height:1.5;margin:0;text-align:justify">Определение локализации источника сигнала не проводится при отсутствии онкологического сигнала.</p>
      </div>
    </div>`;

  // блок «Ограничения метода / Методика» — только в полном варианте
  const fineBlock = compact ? '' : `
    <div class="rp-fine">
      <div><h6>Ограничения метода</h6><ul>
        <li>Исследование не заменяет установленный клинический диагноз и требует подтверждения стандартными методами обследования.</li>
        <li>Диагностическая чувствительность метода снижается на ранних стадиях заболевания и при низкой доле опухолевой ДНК в образце.</li>
        <li>Панель охватывает ограниченный перечень локализаций; отдельные нозологические формы могут не выявляться.</li>
      </ul></div>
      <div><h6>Методика</h6><p>Исследование профиля метилирования свободно циркулирующей ДНК плазмы крови по панели из ${s.heatmap.N} маркерных регионов. Референсный геном — GRCh38 (${s.ref}); платформа секвенирования — DNBSEQ/Illumina. Контроль качества образца — <b>${s.qc.verdict==='Pass'?'пройден':'с замечаниями'}</b>. Оценка вероятности выполнена путём сопоставления профиля метилирования образца с референсными профилями.</p></div>
    </div>`;

  return `
  <div class="doc" style="--det:${detColor};--pred:#463c8c">
    <div class="gm-head">
      <div class="gm-logo">${genomedLogoSVG()}</div>
      <div class="gm-org">
        <div class="gm-reg"><span>ООО «ГЕНОМЕД»</span><span>ИНН/КПП 7701759381/770101001</span><span>ОГРН 1077763509977</span></div>
        <div class="gm-lab">ЛАБОРАТОРИЯ МОЛЕКУЛЯРНОЙ ПАТОЛОГИИ</div>
        <div class="gm-addr">Юр. адрес: 105005, Россия, г. Москва, ул. Бауманская, д. 50/12, стр. 1</div>
      </div>
      <div class="gm-contacts">
        <div>${miniIcon(_IC_PHONE)} +7 (495) 660-83-77</div>
        <div>${miniIcon(_IC_PHONE)} +7 800-333-45-38</div>
        <div>${miniIcon(_IC_MAIL)} callcenter@genomed.ru</div>
        <div>${miniIcon(_IC_GLOBE)} www.genomed.ru</div>
      </div>
    </div>
    <hr class="gm-rule"><hr class="gm-rule2">

    <div class="rp-titleblock">
      <div class="rp-title">ЗАКЛЮЧЕНИЕ</div>
      <div class="rp-subtitle">по результатам исследования метилирования свободно циркулирующей ДНК · тест <b>EpiPrint</b> (ранняя диагностика онкологического процесса)</div>
    </div>

    ${infoBlock}

    <div class="rp-sec">
      <div class="rp-sec__tab" style="background:var(--det)">Выявление</div>
      <div class="rp-sec__body">
        <div class="resultbox">
          <div class="resultbox__legend">Результат</div>
          <div class="result-icon">${detected ? '!' : icon('check')}</div>
          <div>
            <div class="result-h">${detected ? 'Онкологический сигнал обнаружен' : 'Онкологический сигнал не обнаружен'}</div>
            <p class="result-p">${detectionText}</p>
          </div>
        </div>
        <div class="rp-two">
          <div><h5>${icon('circle-check')} Интерпретация</h5><p>${interpText}</p></div>
          <div><h5>${icon('alert-triangle')} Ограничения интерпретации</h5><p>${limitText}</p></div>
        </div>
      </div>
    </div>

    ${predictionBlock}

    ${fineBlock}

    <div class="rp-sign">
      <div>
        <div class="rp-sign__who">Заведующий лабораторией</div>
        <div class="rp-sign__line">
          <div class="rp-sign__name">[И. О. Фамилия]</div>
          <div class="rp-sign__role">врач клинической лабораторной диагностики</div>
        </div>
        <div class="rp-sign__who" style="margin-top:8px">Дата выдачи: ${fmtD(d)}</div>
      </div>
      <div class="seal">${reportSealSVG()}</div>
    </div>

    <div class="rp-foot">
      <div>ООО «Геномед» · Лаборатория молекулярной патологии · г. Москва, ул. Бауманская, д. 50/12, стр. 1</div>
      <div style="text-align:right">Конфиденциально · содержит персональные данные<br>Заключение № ${reportNo} · сформировано ЛИС EpiPrint</div>
    </div>
  </div>`;
}

</script>
<script>
/* ============================================================
   EpiPrint · Lab — минималистичный «LIMS»-слой (bioinformatician-first).
   Переиспользует данные (data.js) и helpers (app.js: icon, pct, heatColor,
   heatmapHtml, toast, get/saveFeedback). Заключение — из report-view.js.
   ============================================================ */

let liveT = null, upd = 0;
function stopT(){ if(liveT){ clearInterval(liveT); liveT=null; } }
const SYS = { load: 62, freeTb: 4.2, avgMin: 47 };

/* короткие теги */
const ST = { done:['done','завершён'], processing:['run','в работе'], queued:['queue','в очереди'], error:['fail','ошибка'], new:['muted','новый'] };
function stTag(s){ const m=ST[s]||ST.new; return `<span class="st st--${m[0]}">${m[1]}</span>`; }
function qcTag(v){ return v==='Pass'?'<span class="st st--pass">PASS</span>':'<span class="st st--fail">FAIL</span>'; }
const RT = { high:['high','высокий'], medium:['med','средний'], low:['low','низкий'] };
function riskTag(r){ const m=RT[r]; return `<span class="st st--${m[0]}">${m[1]}</span>`; }
function cancerLabel(k){ const t=CANCER_TYPES.find(x=>x.key===k); return t?t.label:'—'; }
function sec(t){ return `<span class="sec">${t}</span>`; }
function plural(n, f){ const a=Math.abs(n)%100, n1=a%10; if(a>10&&a<20) return f[2]; if(n1>1&&n1<5) return f[1]; if(n1===1) return f[0]; return f[2]; }
const P_OBR=['образец','образца','образцов'], P_ERR=['ошибка','ошибки','ошибок'];

const NAV_MIN = [
  { r:'dashboard',   l:'Обзор',       ic:'layout-dashboard' },
  { r:'processing',  l:'Обработка',   ic:'list-checks' },
  { r:'results',     l:'Пациенты',    ic:'microscope' },
  { r:'conclusions', l:'Заключения',  ic:'file-text' },
  { g:'Служебное' },
  { r:'users',       l:'Пользователи',ic:'users' },
];

function shell(active, title){
  const proc = SAMPLES.filter(s=>s.status==='processing'||s.status==='queued').length;
  const nav = NAV_MIN.map(n=> n.g ? `<div class="nav__g">${n.g}</div>`
    : `<a class="nav__i ${active===n.r?'on':''}" href="#/${n.r}">${icon(n.ic)}<span>${n.l}</span>${n.r==='processing'&&proc?`<span class="n">${proc}</span>`:''}</a>`).join('');
  document.getElementById('sb').innerHTML = `
    <div class="sb__brand"><div class="sb__mark">${icon('fingerprint')}</div>
      <div class="sb__name">EpiPrint<small>Lab · min</small></div></div>
    <nav class="nav">${nav}</nav>
    <div class="sb__foot">прототип · v0.1 · демо</div>`;
  const mountsOk = MOUNTS.every(m=>m.status==='ok');
  document.getElementById('top').innerHTML = `
    <div class="top__t">${title}</div>
    <div class="top__sys">
      <span>кластер <b>${SYS.load}%</b></span><span>свободно <b>${SYS.freeTb} ТБ</b></span>
      <span><span class="live"></span>обновлено <b id="updv">0с</b></span>
    </div>
    <div class="spacer"></div>
    <div class="seg" id="denseSeg"><button data-d="0">Comfortable</button><button data-d="1">Dense</button></div>
    <input class="search" id="gsearch" placeholder="поиск: SeqID / ФИО">
    <div class="avatar">${CURRENT_USER.initials}</div>`;
  setDenseSeg();
  document.getElementById('denseSeg').querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=> setDense(b.dataset.d==='1')));
  const gs = document.getElementById('gsearch');
  gs.addEventListener('keydown', e=>{ if(e.key==='Enter'&&gs.value.trim()){ minSearch=gs.value.trim(); location.hash='#/results'; }});
  startClock();
}
let minSearch='';
function setDense(on){ document.body.classList.toggle('dense', on); try{ localStorage.setItem('epiprint_dense', on?'1':'0'); }catch(e){} setDenseSeg(); }
function setDenseSeg(){ const on=document.body.classList.contains('dense'); const seg=document.getElementById('denseSeg'); if(seg) seg.querySelectorAll('button').forEach(b=> b.classList.toggle('on', (b.dataset.d==='1')===on)); }
function startClock(){ const el=()=>document.getElementById('updv'); }

/* «живой» счётчик обновления в шапке */
setInterval(()=>{ upd+=1; const e=document.getElementById('updv'); if(e) e.textContent=upd+'с'; }, 1000);

/* ================= Обзор (bioinformatician-first) ================= */
function rDash(v){
  const done=SAMPLES.filter(s=>s.status==='done'), proc=SAMPLES.filter(s=>s.status==='processing'),
        q=SAMPLES.filter(s=>s.status==='queued'), err=SAMPLES.filter(s=>s.status==='error'),
        newN=STORAGE.reduce((a,r)=>a+r.files.filter(f=>!f.launched).length,0);
  const qcFail = done.filter(s=>s.qc.verdict==='Fail');
  const active = [...proc, ...q];

  const strip = `<div class="strip">
    <div class="strip__i"><span class="strip__n">${SAMPLES.length}</span><span class="strip__l">${plural(SAMPLES.length,P_OBR)}</span></div>
    <div class="strip__i b-pass"><span class="strip__n">${done.length}</span><span class="strip__l">завершено</span></div>
    <div class="strip__i b-run"><span class="strip__n">${proc.length}</span><span class="strip__l">в работе</span></div>
    <div class="strip__i"><span class="strip__n">${q.length}</span><span class="strip__l">в очереди</span></div>
    <div class="strip__i b-fail"><span class="strip__n">${err.length}</span><span class="strip__l">${plural(err.length,P_ERR)}</span></div>
    <div class="strip__i b-warn"><span class="strip__n">${newN}</span><span class="strip__l">к запуску</span></div>
  </div>`;

  const activeRows = active.length ? active.map(s=>{
    const idx = s.status==='processing'? 4 : 0;
    const eta = s.status==='processing'? Math.max(1,(PIPELINE_STAGES.length-idx)*5)+' мин' : '—';
    return `<tr class="clk" onclick="location.hash='#/sample/${s.id}'"><td class="id">${s.seqId}</td>
      <td>${stTag(s.status)}</td><td class="num faint">${s.status==='processing'?idx+'/'+PIPELINE_STAGES.length:'—'}</td>
      <td class="num faint">${eta}</td></tr>`;
  }).join('') : `<tr><td colspan="4" class="empty">Активных задач нет</td></tr>`;

  const alerts = [
    ...err.map(s=>`<div class="alert"><span style="color:var(--fail)">${icon('circle-x')}</span><span class="mono">${s.seqId}</span><span class="muted">ошибка пайплайна</span></div>`),
    ...qcFail.slice(0,4).map(s=>`<div class="alert"><span style="color:var(--warn)">${icon('alert-triangle')}</span><span class="mono">${s.seqId}</span><span class="muted">QC: ${s.qc.failed[0]||'fail'}</span></div>`),
    ...MOUNTS.filter(m=>m.status!=='ok').map(m=>`<div class="alert"><span style="color:var(--warn)">${icon('server')}</span><span class="mono">${m.name}</span><span class="muted">${m.note}</span></div>`),
  ];

  const recent = [...done].sort((a,b)=>b.id-a.id).slice(0,8).map(s=>`
    <tr class="clk" onclick="location.hash='#/sample/${s.id}'"><td class="id">${s.seqId}</td>
      <td>${qcTag(s.qc.verdict)}</td>
      <td class="num"><b style="color:${riskC(s.score.risk)}">${pct(s.score.cancerProb)}</b></td>
      <td>${riskTag(s.score.risk)}</td><td>${cancerLabel(s.score.topType)}</td><td class="mono faint">${s.date}</td></tr>`).join('');

  v.innerHTML = `
    <div class="ph"><h1>Обзор</h1><span class="sub">поток за последние 7 дней</span></div>
    ${strip}
    <div class="grid" style="grid-template-columns:1.7fr 1fr;align-items:start">
      <div class="panel"><div class="panel__h">${sec('Очередь · '+active.length)}<span class="spacer"></span><span class="faint mono" style="font-size:.7rem"><span class="live"></span>live</span></div>
        <div class="tw"><table class="t"><thead><tr><th>SeqID</th><th>Статус</th><th class="num">Этап</th><th class="num">ETA</th></tr></thead><tbody>${activeRows}</tbody></table></div></div>
      <div class="grid" style="grid-template-columns:1fr">
        <div class="panel"><div class="panel__h">${sec('Система')}</div><div class="panel__b">
          <div class="leads">
            <div class="lead"><span class="k">Загрузка кластера</span><span class="d"></span><span class="v">${SYS.load}%</span></div>
            <div class="lead"><span class="k">Свободно в хранилище</span><span class="d"></span><span class="v">${SYS.freeTb} ТБ</span></div>
            <div class="lead"><span class="k">Ср. время обработки</span><span class="d"></span><span class="v">${SYS.avgMin} мин/обр.</span></div>
            <div class="lead"><span class="k">Монтирования</span><span class="d"></span><span class="v ${MOUNTS.every(m=>m.status==='ok')?'pass':'fail'}">${MOUNTS.filter(m=>m.status==='ok').length}/${MOUNTS.length}</span></div>
          </div></div></div>
        <div class="panel"><div class="panel__h">${sec('Оповещения · '+alerts.length)}</div>
          <div>${alerts.length?alerts.join(''):'<div class="alert muted">Нет оповещений</div>'}</div></div>
      </div>
    </div>
    <div class="panel" style="margin-top:var(--gap)"><div class="panel__h">${sec('Последние образцы')}<span class="spacer"></span><a class="btn btn--sm" href="#/results">все →</a></div>
      <div class="tw"><table class="t"><thead><tr><th>SeqID</th><th>QC</th><th class="num">Скор (ML)</th><th>Риск</th><th>Локализация</th><th>Дата</th></tr></thead><tbody>${recent}</tbody></table></div></div>`;

  liveT = setInterval(()=>{ /* лёгкая живость: обновление ETA-строки не требуется, тик в шапке уже идёт */ }, 4000);
}
function riskC(r){ return r==='high'?'var(--risk-high)':r==='medium'?'var(--risk-med)':'var(--risk-low)'; }

/* ================= Обработка ================= */
function rProc(v){
  const selected=new Set();
  const newList=()=>{ const a=[]; STORAGE.forEach(r=>r.files.forEach(f=>{ if(!f.launched) a.push(f); })); return a; };
  v.innerHTML = `
    <div class="ph"><h1>Обработка</h1><span class="sub">запуск и мониторинг пайплайна</span><span class="spacer"></span>
      <button class="btn btn--sm" onclick="toast('Обновлено')">${icon('refresh-cw')} обновить</button></div>

    <div class="panel"><div class="panel__h">${sec('К запуску · '+newList().length)}<span class="spacer"></span>
      <label class="mono faint" style="font-size:.72rem"><input type="checkbox" class="chk" id="selAll"> все</label>
      <button class="btn btn--sm" id="runSel" disabled>${icon('play')} запустить</button>
      <button class="btn btn--sm btn--pri" id="runAll">${icon('play')} запустить все</button></div>
      <div class="tw"><table class="t"><thead><tr><th style="width:26px"></th><th>SeqID</th><th class="num">Размер</th><th>Статус</th></tr></thead><tbody id="newRows"></tbody></table></div></div>

    <div class="panel" style="margin-top:var(--gap)"><div class="panel__h">${sec('Очередь обработки')}<span class="spacer"></span>
      <span class="faint mono" style="font-size:.72rem" id="qlive"></span>
      <label class="mono faint" style="font-size:.72rem"><input type="checkbox" class="chk" id="auto" checked> авто</label></div>
      <div class="tw"><table class="t"><thead><tr><th>ID</th><th>Создан</th><th>SeqID</th><th>Этапы</th><th class="num">ETA</th><th>Статус</th><th>Логи</th></tr></thead><tbody id="qRows"></tbody></table></div></div>

    <details class="dd" style="margin-top:var(--gap)"><summary>Архив загрузок · ${STORAGE.length}</summary>
      <div id="arch" style="margin-top:6px"></div></details>`;

  const nr=v.querySelector('#newRows');
  function updSel(){ const n=selected.size; v.querySelector('#runSel').disabled=n===0; v.querySelector('#runSel').innerHTML=`${icon('play')} запустить${n?' · '+n:''}`; }
  function drawNew(){
    const list=newList();
    nr.innerHTML = list.length? list.map(f=>`<tr><td><input type="checkbox" class="chk nchk" data-n="${f.basename}" ${selected.has(f.basename)?'checked':''}></td>
      <td class="id">${f.basename}</td><td class="num faint">${f.sizeGb} ГБ</td><td><span class="st st--muted">готов</span></td></tr>`).join('')
      : `<tr><td colspan="4" class="empty">Новых образцов нет</td></tr>`;
    nr.querySelectorAll('.nchk').forEach(c=> c.addEventListener('change',()=>{ c.checked?selected.add(c.dataset.n):selected.delete(c.dataset.n); updSel(); }));
    v.querySelector('#runAll').disabled=!list.length; v.querySelector('#selAll').disabled=!list.length; updSel();
  }
  function drawArch(){
    v.querySelector('#arch').innerHTML = STORAGE.map(r=>{
      const rows=r.files.map(f=>`<tr><td class="id">${f.basename}</td><td class="num faint">${f.sizeGb} ГБ</td><td>${f.launched?stTag(f.status):'<span class="st st--muted">готов</span>'}</td></tr>`).join('');
      return `<div class="panel" style="margin-bottom:8px"><div class="panel__h"><span class="mono">${r.run}</span><span class="faint mono" style="font-size:.72rem">${r.ref} · ${r.created} · ${r.files.length} обр.</span></div>
        <div class="tw"><table class="t"><thead><tr><th>SeqID</th><th class="num">Размер</th><th>Статус</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    }).join('');
  }
  function launch(names){ if(!names.length){ toast('Нет готовых образцов'); return; }
    STORAGE.forEach(r=>r.files.forEach(f=>{ if(names.includes(f.basename)){ f.launched=true; f.status='queued'; }}));
    selected.clear(); v.querySelector('#selAll').checked=false; drawNew(); drawArch(); toast(`${names.length} образц(ов) в очереди`); }
  v.querySelector('#selAll').addEventListener('change',e=>{ nr.querySelectorAll('.nchk').forEach(c=>{ c.checked=e.target.checked; c.checked?selected.add(c.dataset.n):selected.delete(c.dataset.n); }); updSel(); });
  v.querySelector('#runSel').addEventListener('click',()=>launch([...selected]));
  v.querySelector('#runAll').addEventListener('click',()=>launch(newList().map(f=>f.basename)));

  const Q=JSON.parse(JSON.stringify(QUEUE)); let tsince=0; const openQ=new Set();
  const stStatus=(q,i)=> (q.status==='error'&&i===q.stageIdx)?'err' : i<q.stageIdx?'done' : (i===q.stageIdx&&q.status==='processing')?'run':'wait';
  function stepsMini(q){ return `<div style="display:flex;gap:2px">`+PIPELINE_STAGES.map((_,i)=>{ const c=stStatus(q,i); const col=c==='done'?'var(--pass)':c==='run'?'var(--info)':c==='err'?'var(--fail)':'var(--line)'; return `<span style="width:13px;height:5px;border-radius:1px;background:${col}"></span>`; }).join('')+`</div>`; }
  function stageList(q){ const rng=rngFor(q.seqId+'_st'); const dm=q.created.match(/(\d+)\s+(\S+?)\.?\s+(\d+):(\d+)/);
    let day=dm?dm[1]:'09',mon=dm?dm[2]:'июл',hh=dm?+dm[3]:15,mm=dm?+dm[4]:0,ss=between(rng,0,59);
    return `<div class="steps2">`+PIPELINE_STAGES.map((name,i)=>{ const st=stStatus(q,i); let t='',d='';
      if(st==='done'){ t=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`; const dM=between(rng,0,26),dS=between(rng,1,59); d=dM?`${dM} мин`:`${dS} сек`; mm+=dM; ss=(ss+dS)%60; while(mm>=60){mm-=60;hh++;} }
      else if(st==='run') t='выполняется'; else if(st==='err') t='ошибка'; else t='—';
      const mk=st==='done'?'✓':st==='err'?'✕':st==='run'?'●':(i+1);
      return `<div class="step2"><span class="mk ${st}">${mk}</span><span class="nm">${name}</span><span class="tm">${t}${d?' · '+d:''}</span></div>`; }).join('')+`</div>`; }
  function drawQ(){
    const rows=v.querySelector('#qRows');
    rows.querySelectorAll('details[data-q]').forEach(d=>{ if(d.open)openQ.add(d.dataset.q); else openQ.delete(d.dataset.q); });
    rows.innerHTML = Q.map(q=>{ const idx=q.stageIdx; const eta=q.status==='processing'?Math.max(1,(PIPELINE_STAGES.length-idx)*5)+'м':q.status==='queued'?'в оч.':'—';
      return `<tr class="${q.status==='done'?'clk':''}" ${q.status==='done'?`onclick="location.hash='#/sample/${q.id}'"`:''}>
        <td class="mono faint">${q.id}</td><td class="mono faint" style="font-size:11px">${q.created}</td><td class="id">${q.seqId}</td>
        <td><details class="dd" data-q="${q.id}" ${openQ.has(String(q.id))?'open':''} onclick="event.stopPropagation()"><summary>${stepsMini(q)}</summary><div style="margin-top:4px;min-width:340px">${stageList(q)}</div></details></td>
        <td class="num faint">${eta}</td><td>${stTag(q.status)}</td>
        <td><a class="mono" style="font-size:11px;cursor:pointer" onclick="event.stopPropagation();toast('status.log')">status.log</a></td></tr>`;
    }).join('');
  }
  function qlive(){ const a=Q.filter(q=>q.status==='processing').length; v.querySelector('#qlive').innerHTML=`<span class="live"></span>${a} в работе · ${tsince}с`; }
  function tick(){ if(!v.querySelector('#auto').checked){ tsince+=2; qlive(); return; } tsince=0;
    Q.forEach(q=>{ if(q.status==='processing'&&Math.random()>.4){ q.stageIdx++; if(q.stageIdx>=PIPELINE_STAGES.length){ q.status='done'; q.stageIdx=PIPELINE_STAGES.length; const nx=Q.find(x=>x.status==='queued'); if(nx){ nx.status='processing'; nx.stageIdx=1; } } } });
    drawQ(); qlive(); }
  drawNew(); drawArch(); drawQ(); qlive();
  liveT=setInterval(()=>{ tsince+=2; if(v.querySelector('#auto')&&v.querySelector('#auto').checked) tick(); else qlive(); }, 2000);
}

/* ================= Заключение (reuse) ================= */
function rReport(v, id, sub){
  const s=sampleById(id)||SAMPLES.find(x=>x.status==='done'); const variant=sub==='full'?'full':'compact';
  v.innerHTML = `<div class="hstack" style="display:flex;gap:8px;max-width:210mm;margin:0 auto 10px" class="no-print">
    <a class="btn btn--sm" href="#/sample/${s.id}">${icon('arrow-left')} к образцу</a><span class="spacer" style="flex:1"></span>
    <button class="btn btn--sm" onclick="window.print()">${icon('printer')} печать / PDF</button></div>` + buildReportDoc(s, variant);
}

/* ================= Роутер ================= */
const ROUTES = { dashboard:['Обзор','dashboard',rDash], processing:['Обработка','processing',rProc], results:['Пациенты','results',rResults],
  conclusions:['Заключения','conclusions',rConcl], sample:['Образец','results',rSample], report:['Заключение','conclusions',rReport], users:['Пользователи','users',rUsers] };
function router(){
  stopT();
  const h=location.hash.replace(/^#\/?/,''); const p=h.split('/'); let route=p[0], id=p[1], sub=p[2];
  if(!route||!ROUTES[route]) route='dashboard';
  const def=ROUTES[route]; shell(def[1], def[0]);
  const v=document.getElementById('view'); v.innerHTML='';
  def[2](v, id, sub); window.scrollTo(0,0);
}
window.addEventListener('hashchange', router);
try{ if(localStorage.getItem('epiprint_dense')==='1') document.body.classList.add('dense'); }catch(e){}
router();
