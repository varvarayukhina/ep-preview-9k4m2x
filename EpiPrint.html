<!doctype html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EpiPrint — портал</title>
<style>
/* ============================================================
   EpiPrint — портал ранней диагностики рака по метилированию cfDNA
   Дизайн-система (прототип). Genomed-style, клинический, без маркетинга.
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  /* палитра */
  --bg:        #eceff3;
  --surface:   #ffffff;
  --surface-2: #f6f8fa;
  --ink:       #16202b;
  --ink-2:     #566574;
  --ink-3:     #8a99a8;
  --line:      #e3e8ee;
  --line-2:    #eef2f6;

  --brand:      #0b6b73;
  --brand-600:  #0e7d86;
  --brand-700:  #095157;
  --brand-050:  #e5f1f2;

  --pass:   #1a9d5a;  --pass-bg:  #e6f5ec;
  --warn:   #c8820a;  --warn-bg:  #fbf1dd;
  --fail:   #d64545;  --fail-bg:  #fbe8e8;
  --info:   #2b7fd6;  --info-bg:  #e6f0fb;
  --queued: #7a8896;  --queued-bg:#eef1f4;

  /* риск */
  --risk-high:#c0392b; --risk-high-bg:#fbe7e4;
  --risk-med: #d98a1f; --risk-med-bg:#fbf0dc;
  --risk-low: #1a9d5a; --risk-low-bg:#e6f5ec;

  /* хитмап: 0 метилирование = синий → высокое = красный (конвенция лаборатории) */
  --hm-0:#2c6fb3; --hm-mid:#f4f2ee; --hm-1:#c0392b;

  --disp:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --sb-w: 248px;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(20,32,43,.04), 0 4px 16px rgba(20,32,43,.06);
  --shadow-lg: 0 8px 32px rgba(20,32,43,.14);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--body);
  color: var(--ink);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--brand-600); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- layout ---------- */
.layout { display: flex; min-height: 100vh; }
.main {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  margin-left: var(--sb-w);
}
.content { padding: 20px 28px 48px; max-width: 1360px; width: 100%; }

/* ---------- sidebar ---------- */
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: var(--sb-w);
  background: linear-gradient(185deg, #0c2b30 0%, #0a2226 100%);
  color: #cfe0e1; display: flex; flex-direction: column;
  z-index: 30;
}
.brand {
  display: flex; align-items: center; gap: 11px;
  padding: 20px 20px 18px; border-bottom: 1px solid rgba(255,255,255,.07);
}
.brand__mark {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: linear-gradient(145deg, var(--brand-600), #12a1ab);
  display: grid; place-items: center; box-shadow: 0 4px 14px rgba(14,125,134,.4);
}
.brand__mark svg { width: 22px; height: 22px; color: #fff; }
.brand__name { font-family: var(--disp); font-weight: 800; font-size: 1.12rem; color: #fff; letter-spacing: -.01em; line-height: 1; }
.brand__sub  { font-family: var(--mono); font-size: .62rem; letter-spacing: .13em; text-transform: uppercase; color: #6f9296; margin-top: 4px; }

.nav { padding: 14px 12px; flex: 1; overflow-y: auto; }
.nav__group { font-family: var(--mono); font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: #5d8085; padding: 14px 12px 7px; }
.nav__item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 12px; border-radius: 9px; color: #b6cccd;
  font-weight: 500; font-size: .9rem; cursor: pointer; margin-bottom: 2px;
  transition: background .12s, color .12s;
}
.nav__item:hover { background: rgba(255,255,255,.06); color: #fff; text-decoration: none; }
.nav__item.is-active { background: rgba(18,161,171,.18); color: #fff; box-shadow: inset 2px 0 0 var(--brand-600); }
.nav__item svg { width: 18px; height: 18px; flex: none; opacity: .9; }
.nav__badge { margin-left: auto; font-family: var(--mono); font-size: .68rem; background: rgba(255,255,255,.12); color: #dbeaeb; padding: 1px 7px; border-radius: 20px; }
.sidebar__foot { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,.07); font-family: var(--mono); font-size: .64rem; color: #5d8085; }

/* ---------- topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(255,255,255,.86); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 16px;
  padding: 0 30px; height: 60px;
}
.topbar__title { font-family: var(--disp); font-weight: 700; font-size: 1.18rem; letter-spacing: -.01em; }
.topbar__crumb { color: var(--ink-3); font-size: .82rem; }
.topbar__spacer { flex: 1; }
.topbar__search {
  display: flex; align-items: center; gap: 8px; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; color: var(--ink-3); min-width: 220px;
}
.topbar__search input { border: 0; background: transparent; outline: 0; font-family: var(--body); font-size: .86rem; color: var(--ink); width: 100%; }
.topbar__search svg { width: 16px; height: 16px; }
.topbar__user { display: flex; align-items: center; gap: 9px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(145deg,var(--brand-600),#12a1ab); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .82rem; }

/* ---------- typography helpers ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
.page-head h1 { font-family: var(--disp); font-weight: 800; font-size: 1.5rem; letter-spacing: -.02em; margin: 0 0 4px; }
.page-head p { color: var(--ink-2); margin: 0; font-size: .9rem; max-width: 640px; }
.eyebrow { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); display: inline-flex; align-items: center; gap: .55em; margin-bottom: 6px; }
.eyebrow::before { content:""; width: 22px; height: 2px; background: var(--brand-600); border-radius:2px; }
.section-title { font-family: var(--disp); font-weight: 700; font-size: 1.02rem; margin: 0 0 2px; display:flex; align-items:center; gap:8px; }
.section-title svg { width:18px;height:18px;color:var(--brand); }
.muted { color: var(--ink-2); }
.mono { font-family: var(--mono); }
.nowrap { white-space: nowrap; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card__head { padding: 15px 18px; border-bottom: 1px solid var(--line-2); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card__body { padding: 15px; }
.card__foot { padding: 12px 18px; border-top: 1px solid var(--line-2); background: var(--surface-2); border-radius: 0 0 var(--radius) var(--radius); }
.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(2,1fr); }
.grid-3 { grid-template-columns: repeat(3,1fr); }
.grid-4 { grid-template-columns: repeat(4,1fr); }
.grid-auto { grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); }
@media (max-width: 1080px){ .grid-3,.grid-4{grid-template-columns:repeat(2,1fr)} .content{padding:20px} }
@media (max-width: 720px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr} }

/* ---------- stat tiles ---------- */
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.stat__label { font-size: .78rem; color: var(--ink-2); display: flex; align-items: center; gap: 8px; font-weight: 500; }
.stat__label .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--brand-050); color: var(--brand); }
.stat__label .ic svg { width: 17px; height: 17px; }
.stat__value { font-family: var(--disp); font-weight: 800; font-size: 1.9rem; letter-spacing: -.02em; margin-top: 10px; line-height: 1; }
.stat__sub { font-size: .76rem; color: var(--ink-3); margin-top: 6px; }
.stat__sub b { color: var(--pass); font-weight: 600; }
.stat__sub b.down { color: var(--fail); }

/* ---------- badges / chips ---------- */
.ic-svg { flex: none; vertical-align: middle; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: .72rem; font-weight: 500; padding: 2px 9px; border-radius: 20px; line-height: 1.55; white-space: nowrap; }
.badge svg { width: 13px; height: 13px; }
.chip svg { width: 13px; height: 13px; }
.tbl .id svg { width: 15px; height: 15px; color: var(--ink-3); }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge--pass  { color: var(--pass);  background: var(--pass-bg); }
.badge--fail  { color: var(--fail);  background: var(--fail-bg); }
.badge--warn  { color: var(--warn);  background: var(--warn-bg); }
.badge--info  { color: var(--info);  background: var(--info-bg); }
.badge--proc  { color: var(--info);  background: var(--info-bg); }
.badge--done  { color: var(--pass);  background: var(--pass-bg); }
.badge--queued{ color: var(--queued);background: var(--queued-bg); }
.badge--error { color: var(--fail);  background: var(--fail-bg); }
.badge--muted { color: var(--ink-2); background: var(--surface-2); }
.badge--high { color: var(--risk-high); background: var(--risk-high-bg); }
.badge--med  { color: var(--risk-med);  background: var(--risk-med-bg); }
.badge--low  { color: var(--risk-low);  background: var(--risk-low-bg); }
.chip { display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:.7rem; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--line); padding:2px 8px; border-radius:6px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; font-family: var(--body); font-weight: 600; font-size: .85rem; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; transition: .12s; white-space: nowrap; }
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn svg { width: 16px; height: 16px; }
.btn--primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn--primary:hover { background: var(--brand-700); }
.btn--ghost { background: transparent; }
.btn--sm { padding: 5px 10px; font-size: .8rem; }
.btn--icon { padding: 7px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .85rem; }
.tbl th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: .74rem; text-transform: uppercase; letter-spacing: .04em; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
.tbl th.sortable { cursor: pointer; }
.tbl th.sortable:hover { color: var(--ink); }
.tbl td { padding: 9px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
#qrows > tr > td { vertical-align: top; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl tbody tr.clickable { cursor: pointer; }
.tbl .num { text-align: right; font-family: var(--mono); }
.tbl .id  { font-family: var(--mono); font-size: .82rem; color: var(--ink); }
.tbl__empty { padding: 40px; text-align: center; color: var(--ink-3); }
.checkbox { width: 16px; height: 16px; accent-color: var(--brand); cursor: pointer; }

/* ---------- toolbar / filters ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar__spacer { flex: 1; }
.select, .input { font-family: var(--body); font-size: .85rem; padding: 7px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); outline: none; }
.select:focus, .input:focus { border-color: var(--brand-600); }
.segmented { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; }
.segmented button { border: 0; background: transparent; font-family: var(--body); font-size: .8rem; font-weight: 600; color: var(--ink-2); padding: 5px 12px; border-radius: 6px; cursor: pointer; }
.segmented button.is-active { background: var(--surface); color: var(--brand); box-shadow: var(--shadow); }

/* ---------- mount monitor ---------- */
.mount { display: flex; align-items: center; gap: 12px; padding: 13px 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.mount__dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 4px currentColor; }
.mount__dot.ok   { color: rgba(26,157,90,.14);  background: var(--pass); }
.mount__dot.warn { color: rgba(200,130,10,.16); background: var(--warn); }
.mount__dot.down { color: rgba(214,69,69,.16);  background: var(--fail); }
.mount__name { font-family: var(--mono); font-size: .82rem; font-weight: 500; }
.mount__path { font-size: .72rem; color: var(--ink-3); font-family: var(--mono); }

/* ---------- progress / stages ---------- */
.progress { height: 7px; background: var(--line-2); border-radius: 20px; overflow: hidden; }
.progress__bar { height: 100%; background: linear-gradient(90deg,var(--brand-600),#16b5c0); border-radius: 20px; transition: width .4s ease; }
.stages { display: flex; gap: 3px; align-items: center; }
.stage-pip { width: 15px; height: 6px; border-radius: 3px; background: var(--line); }
.stage-pip.done { background: var(--pass); }
.stage-pip.active { background: var(--info); animation: pulse 1.2s infinite; }
.stage-pip.error { background: var(--fail); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

.stage-list { display: flex; flex-direction: column; gap: 0; }
.stage-row { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line-2); }
.stage-row:last-child { border-bottom: 0; }
.stage-ic { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--mono); font-size: .7rem; font-weight: 600; }
.stage-ic.done { background: var(--pass-bg); color: var(--pass); }
.stage-ic.active { background: var(--info-bg); color: var(--info); }
.stage-ic.wait { background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); }
.stage-ic.error { background: var(--fail-bg); color: var(--fail); }
.stage-name { font-weight: 500; font-size: .88rem; }
.stage-time { margin-left: auto; font-family: var(--mono); font-size: .76rem; color: var(--ink-3); }

/* ---------- score gauge ---------- */
.gauge-wrap { display: flex; align-items: center; gap: 22px; }
.gauge { position: relative; width: 150px; height: 150px; flex: none; }
.gauge svg { transform: rotate(-90deg); }
.gauge__center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.gauge__pct { font-family: var(--disp); font-weight: 800; font-size: 2rem; letter-spacing: -.02em; line-height: 1; }
.gauge__cap { font-size: .68rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; margin-top: 4px; }

/* ---------- localization bars ---------- */
.locbars { display: flex; flex-direction: column; gap: 9px; }
.locbar { display: grid; grid-template-columns: 168px 1fr 46px; align-items: center; gap: 12px; }
.locbar__name { font-size: .84rem; color: var(--ink); }
.locbar__track { height: 9px; background: var(--line-2); border-radius: 20px; overflow: hidden; }
.locbar__fill { height: 100%; border-radius: 20px; }
.locbar__val { font-family: var(--mono); font-size: .8rem; text-align: right; color: var(--ink-2); }
.locbar.top .locbar__name { font-weight: 700; }
@media (max-width:640px){ .locbar{grid-template-columns:120px 1fr 40px} }

/* ---------- heatmap ---------- */
.heatmap { overflow-x: auto; padding-bottom: 6px; }
.heatmap__inner { display: inline-block; }
.hm-row { display: flex; align-items: center; gap: 0; }
.hm-label { width: 150px; flex: none; font-size: .78rem; text-align: right; padding-right: 12px; color: var(--ink-2); }
.hm-label.strong { font-weight: 600; color: var(--ink); }
.hm-cell { width: 13px; height: 22px; flex: none; }
.hm-scale { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: .74rem; color: var(--ink-3); }
.hm-scale__bar { width: 160px; height: 9px; border-radius: 5px; background: linear-gradient(90deg,var(--hm-0),var(--hm-mid),var(--hm-1)); }

/* ---------- metric list (QC) ---------- */
.metric { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line-2); }
.metric:last-child { border-bottom: 0; }
.metric__name { font-size: .86rem; }
.metric__name small { display:block; color: var(--ink-3); font-size: .72rem; font-family: var(--mono); }
.metric__val { font-family: var(--mono); font-weight: 600; font-size: .9rem; text-align: right; }

/* ---------- feedback ---------- */
.feedback { display: flex; flex-direction: column; gap: 14px; }
.radio-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.radio-card { border: 1.5px solid var(--line); border-radius: 10px; padding: 13px 15px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: .12s; }
.radio-card:hover { border-color: var(--brand-600); }
.radio-card.is-sel-yes { border-color: var(--pass); background: var(--pass-bg); }
.radio-card.is-sel-no  { border-color: var(--fail); background: var(--fail-bg); }
.radio-card svg { width: 20px; height: 20px; }
.textarea { width: 100%; font-family: var(--body); font-size: .86rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; resize: vertical; min-height: 66px; outline: none; }
.textarea:focus { border-color: var(--brand-600); }

/* ---------- KV list ---------- */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; font-size: .85rem; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-weight: 500; font-family: var(--mono); font-size: .82rem; }

/* ---------- toast ---------- */
.toast-host { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
.toast { background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 10px; box-shadow: var(--shadow-lg); font-size: .85rem; display: flex; align-items: center; gap: 10px; animation: slideup .3s ease; max-width: 360px; }
.toast svg { width: 18px; height: 18px; color: #46d39a; flex: none; }
@keyframes slideup { from{ transform: translateY(12px); opacity: 0 } to{ transform: translateY(0); opacity: 1 } }

/* ---------- misc ---------- */
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pass); box-shadow: 0 0 0 4px var(--pass-bg); display: inline-block; animation: pulse 1.6s infinite; }
.divider { height: 1px; background: var(--line); margin: 18px 0; border: 0; }
.hstack { display: flex; align-items: center; gap: 10px; }
.vstack { display: flex; flex-direction: column; gap: 10px; }
.wrap-gap { display:flex; gap:8px; flex-wrap:wrap; }
.text-right { text-align: right; }
.spacer { flex: 1; }

/* ---------- onboarding (Обзор) ---------- */
.hero { background: linear-gradient(120deg,#0c2b30 0%,#0a2226 100%); color: #dbe9ea; border-radius: 14px; padding: 24px 26px; position: relative; overflow: hidden; }
.hero__eyebrow { font-family: var(--mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: #6f9296; }
.hero h1 { font-family: var(--disp); font-weight: 800; font-size: 1.5rem; letter-spacing: -.02em; margin: 6px 0 6px; color: #fff; }
.hero p { color: #a9c7ca; font-size: .9rem; max-width: 680px; margin: 0; line-height: 1.5; }
.steps { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
.step { flex: 1; min-width: 150px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09); border-radius: 11px; padding: 14px 15px; position: relative; }
.step__n { width: 26px; height: 26px; border-radius: 50%; background: var(--brand-600); color: #fff; display: grid; place-items: center; font-family: var(--disp); font-weight: 800; font-size: .85rem; margin-bottom: 9px; }
.step__t { font-weight: 700; font-size: .92rem; color: #fff; }
.step__d { font-size: .78rem; color: #8fb1b4; margin-top: 3px; line-height: 1.4; }
.step__arrow { position: absolute; right: -13px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,.25); z-index: 2; }
.step__arrow svg { width: 18px; height: 18px; }
.step:last-child .step__arrow { display: none; }

.cta { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--brand); border-radius: 12px; padding: 16px 20px; box-shadow: var(--shadow); }
.cta__ic { width: 44px; height: 44px; border-radius: 11px; background: var(--brand-050); color: var(--brand); display: grid; place-items: center; flex: none; }
.cta__ic svg { width: 24px; height: 24px; }
.cta__t { font-family: var(--disp); font-weight: 800; font-size: 1.15rem; letter-spacing: -.01em; }

<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="view"></main>
  </div>
</div>
<script>
/* ============================================================
   EpiPrint — мок-данные прототипа (детерминированные).
   Ничего из этого не является реальными медицинскими данными.
   ============================================================ */

// --- детерминированный PRNG (mulberry32) ---
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function rngFor(s){ return mulberry32(hashStr(s)); }
function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }
function between(rng, a, b, dp=0){ const v=a+rng()*(b-a); return dp?+v.toFixed(dp):Math.round(v); }

// --- справочники ---
const CANCER_TYPES = [
  { key:'breast',     label:'Молочная железа' },
  { key:'colorectal', label:'Колоректальный' },
  { key:'prostate',   label:'Предстательная железа' },
  { key:'lung',       label:'Лёгкое' },
  { key:'liver',      label:'Печень' },
  { key:'stomach',    label:'Желудок' },
  { key:'pancreas',   label:'Поджелудочная железа' },
  { key:'esophagus',  label:'Пищевод' },
];
const KITS = [
  { key:'vazyme', label:'Vazyme',       method:'WGBS' },
  { key:'rasel',  label:'Rasel',        method:'WGBS' },
  { key:'brock',  label:'Burning Rock', method:'Таргетный (ELSA-seq)' },
];
const REF = 'hg38';

// стадии пайплайна — по реальному status.log (Nanodigm) + downstream
const PIPELINE_STAGES = [
  'fastp',
  'Выравнивание (bwa-meth)',
  'MarkDuplicates',
  'CollectMultipleMetrics',
  'CollectWgsMetrics',
  'Uniformity',
  'MethylDackel',
  'Cytosine QC',
  'Build JSON',
  'Классификатор',
  'Формирование заключения',
];

// панель маркерных регионов метилирования, сгруппированная по типу рака
// (реальные гены-маркеры cfDNA-метилирования, позиции — демо)
const _MK = {
  breast:     ['RASSF1A','GSTP1','CDH13','RARB','BRCA1','SFRP1'],
  colorectal: ['SEPT9','BCAT1','NDRG4','SFRP2','TFPI2','VIM','APC'],
  prostate:   ['GSTP1','APC','RASSF1A','PTGS2','RARB','TIG1'],
  lung:       ['SHOX2','RASSF1A','PTGER4','HOXA7','SCT','CDO1'],
  liver:      ['BMPR1A','HOXA10','SEPT9','RASSF1A','APC'],
  stomach:    ['RPRM','RNF180','CDH1','TFPI2','MLH1'],
  pancreas:   ['BNC1','ADAMTS1','SFRP2','NPTX2','CDKN2A'],
  esophagus:  ['SFRP1','TAC1','HPP1','CDH13','APC'],
};
const MARKER_PANEL = CANCER_TYPES.flatMap(ct => (_MK[ct.key]||[]).map((g,i)=>{
  const r = rngFor(ct.key+'_'+g+'_'+i);
  return { gene:g, cancer:ct.key, pos: between(r, 1000000, 199000000) };
}));

// --- генерация выборки образцов ---
const FEMALE_CODES = ['SII','LNV','TRI','TIS','BAS','ESR','KMA','ONA'];
const MALE_CODES   = ['RAM','GEL','ARV','ZVP','URM','PNI','SIV','DKO'];
const SURNAMES = ['Соколов','Кузнецов','Попов','Лебедев','Козлов','Новиков','Морозов','Волков','Соловьёв','Васильев','Зайцев','Павлов','Семёнов','Голубев','Виноградов','Богданов','Воробьёв','Фёдоров','Михайлов','Беляев','Тарасов','Комаров','Орлов','Киселёв','Макаров','Андреев','Ковалёв','Ильин','Гусев','Титов'];
const INITS = ['А','Б','В','Г','Д','Е','И','К','Л','М','Н','О','П','Р','С','Т','Ю','Я'];
function makeFio(seed, isFemale){ const r=rngFor(seed+'_fio'); let sur=pick(r,SURNAMES); if(isFemale) sur+='а'; return `${sur} ${pick(r,INITS)}. ${pick(r,INITS)}.`; }

// QC-метрики по формату реального qc.json (Nanodigm): conversion_rate, coverage,
// cpg (mean_cov / pct_5x / mbias), duplicates, insert_size, q30, gc, strand_ratio.
function makeQC(rng, kit){
  let conversion = between(rng, 99.1, 99.85, 2);   // conversion_rate
  let meanDepth  = between(rng, 12, 22, 1);         // coverage.mean
  let uniformity = between(rng, 96, 99.5, 1);       // coverage.uniformity
  let cov10      = between(rng, 72, 92, 1);         // coverage.pct_10x
  let cpgMean    = between(rng, 4.6, 8, 2);         // cpg.mean_cov
  let cpgCov     = between(rng, 46, 66, 1);         // cpg.pct_5x
  let mbias      = between(rng, -0.06, 0.06, 3);    // cpg.mbias_diff
  let dup        = between(rng, 4, 13, 1);          // duplicates
  let insert     = between(rng, 135, 155);          // insert_size.median
  let mapped     = between(rng, 95.5, 99.4, 1);     // доля картированных
  let q30        = between(rng, 92.5, 96, 1);       // reads.q30_rate
  const gc       = between(rng, 19, 24, 1);         // gc_content (низкий из-за бисульфита)
  let strand     = between(rng, 0.985, 1.02, 3);    // strand_ratio
  const tumorFrac= between(rng, 0.3, 9.5, 1);

  // ~20% образцов — одна метрика вне порога (реализм потока)
  if (rng() < 0.20){
    const w = Math.floor(rng()*5);
    if (w===0) conversion = between(rng, 98.3, 98.9, 2);
    else if (w===1) uniformity = between(rng, 88, 95.5, 1);
    else if (w===2) cpgCov = between(rng, 32, 44, 1);
    else if (w===3) q30 = between(rng, 86, 91.5, 1);
    else dup = between(rng, 15, 24, 1);
  }

  const metrics = [
    { key:'conversion', name:'Эффективность бисульфитной конверсии', unit:'%',  value:conversion, threshold:'≥ 99.0', pass: conversion>=99.0 },
    { key:'meanDepth',  name:'Средняя глубина покрытия', unit:'×', value:meanDepth, threshold:'≥ 10', pass: meanDepth>=10 },
    { key:'uniformity', name:'Равномерность покрытия', unit:'%', value:uniformity, threshold:'≥ 90', pass: uniformity>=90 },
    { key:'cov10',      name:'Доля оснований ≥ 10×', unit:'%', value:cov10, threshold:'≥ 70', pass: cov10>=70 },
    { key:'cpgMean',    name:'Среднее покрытие CpG', unit:'×', value:cpgMean, threshold:'≥ 4', pass: cpgMean>=4 },
    { key:'cpgCov',     name:'Доля CpG с покрытием ≥ 5×', unit:'%', value:cpgCov, threshold:'≥ 45', pass: cpgCov>=45 },
    { key:'mbias',      name:'M-bias, разница', unit:'', value:mbias, threshold:'|≤ 0.1|', pass: Math.abs(mbias)<=0.1 },
    { key:'dup',        name:'Уровень дупликатов', unit:'%', value:dup, threshold:'≤ 15', pass: dup<=15 },
    { key:'insert',     name:'Размер вставки, медиана', unit:'bp', value:insert, threshold:'120–160', pass: insert>=120&&insert<=160 },
    { key:'mapped',     name:'Доля картированных ридов', unit:'%', value:mapped, threshold:'≥ 95', pass: mapped>=95 },
    { key:'q30',        name:'Доля оснований Q30', unit:'%', value:q30, threshold:'≥ 92', pass: q30>=92 },
    { key:'gc',         name:'GC-состав', unit:'%', value:gc, threshold:'справочно', pass:true },
    { key:'strand',     name:'Соотношение цепей', unit:'', value:strand, threshold:'0.9–1.1', pass: strand>=0.9&&strand<=1.1 },
    { key:'tumorFrac',  name:'Оценка опухолевой фракции', unit:'%', value:tumorFrac, threshold:'справочно', pass:true },
  ];
  const failed = metrics.filter(m=>!m.pass && m.threshold!=='справочно').map(m=>m.name);
  return { metrics, failed, verdict: failed.length? 'Fail':'Pass' };
}

function makeScore(rng, forcedCancer){
  const isCancer = forcedCancer!==undefined ? forcedCancer : rng()>0.55;
  let cancerProb;
  if (isCancer) cancerProb = between(rng, 0.62, 0.94, 3);
  else          cancerProb = between(rng, 0.02, 0.34, 3);

  // локализация: один доминирующий тип + фон
  const weights = CANCER_TYPES.map(()=> rng());
  const domIdx = Math.floor(rng()*CANCER_TYPES.length);
  weights[domIdx] += isCancer ? 2.4 : 0.4;
  const sum = weights.reduce((a,b)=>a+b,0);
  const localization = {};
  CANCER_TYPES.forEach((t,i)=> localization[t.key] = +(weights[i]/sum).toFixed(3));

  let risk = 'low';
  if (cancerProb>=0.7) risk='high'; else if (cancerProb>=0.45) risk='medium';
  return { cancerProb, risk, localization, topType: CANCER_TYPES[domIdx].key };
}

// heatmap по панели маркеров (регион × [Образец, Норма, Опухоль]).
// Образец тяготеет к норме; при онкопроцессе регионы соответствующей
// локализации сильнее сдвигаются к «опухолевому» паттерну.
function makeHeatmap(seqId, isCancer, topType){
  const rng = rngFor(seqId+'_hm');
  const regions = MARKER_PANEL;
  const N = regions.length;
  const norm = [], tumor = [], sample = [], loci = [];
  regions.forEach((reg, i)=>{
    const n = +(rng()*0.32).toFixed(3);           // норма — низкое
    const t = +(0.55 + rng()*0.45).toFixed(3);    // опухоль — высокое
    let shift = rng()*0.10;
    if (isCancer) shift = (reg.cancer===topType) ? (0.40 + rng()*0.40) : (0.05 + rng()*0.22);
    const s = +Math.min(1, n*(1-shift) + t*shift).toFixed(3);
    norm.push(n); tumor.push(t); sample.push(s);
    loci.push({ gene:reg.gene, pos:reg.pos, cancer:reg.cancer, sample:s, norm:n, delta:+(s-n).toFixed(3) });
  });
  const topLoci = [...loci].sort((a,b)=> b.delta - a.delta).slice(0, 8);
  return { N, regions, topLoci, rows:[
    { label:'Образец', strong:true, values:sample },
    { label:'Норма', values:norm },
    { label:'Опухоль', values:tumor },
  ]};
}

// --- сборка образцов ---
function buildSamples(){
  const runs = ['R2026-018','R2026-019','R2026-020','R2026-021'];
  const statuses = [
    // распределение статусов по образцам
    'done','done','done','done','done','done','done','done','done','done','done','done',
    'done','done','processing','processing','processing','queued','queued','queued','error','done','done','done'
  ];
  const out = [];
  for (let i=0;i<statuses.length;i++){
    const status = statuses[i];
    const rng = rngFor('sample'+i);
    const isFemale = rng()>0.5;
    const codeSet = isFemale? FEMALE_CODES: MALE_CODES;
    const pcode = pick(rng, codeSet) + String(between(rng,10,31)).padStart(2,'0') + String(between(rng,1,12)).padStart(2,'0') + String(between(rng,40,99));
    const kit = KITS[i % 3];
    const run = runs[i % runs.length];
    const idx = 30 + i;
    const seqId = `EP_${run.slice(5)}_${String(idx).padStart(2,'0')}_${pcode}`;
    const patientNo = 'P-' + String(hashStr(seqId)%900000+100000);
    const day = 3 + Math.floor(i/6);
    const date = `2026-07-0${day}`;

    const done = status==='done';
    const qc = makeQC(rngFor(seqId+'_qc'), kit);
    const sc = done ? makeScore(rngFor(seqId+'_sc')) : null;
    const isCancer = sc ? sc.cancerProb>0.5 : (rng()>0.5);

    // обратная связь — только для части завершённых
    let feedback = { confirmed:null, note:'', date:'', locConfirmed:'' };
    if (done && i%4===0 && sc){
      const agree = sc.cancerProb>0.5 ? rng()>0.25 : rng()>0.15;
      feedback = {
        confirmed: sc.cancerProb>0.5 ? (agree?'yes':'no') : (agree?'no':'yes'),
        note: '',
        date: `2026-07-0${day+1}`,
        locConfirmed: (sc.cancerProb>0.5 && agree) ? sc.topType : ''
      };
    }

    out.push({
      i, id: 5100+i, seqId, run, ref:REF, kit,
      patientCode: pcode, patientNo, fio: makeFio(seqId, isFemale), sex: isFemale?'Ж':'М', age: between(rng,38,74),
      contractor: pick(rng, ['ООО «Медикал Поинт»','АО «ЕМЦ»','КДЛ ДОМОДЕДОВО','Внутр. валидация','ООО «Юни Медика»']),
      date, status,
      qc, score: sc, isCancer,
      heatmap: makeHeatmap(seqId, isCancer, sc ? sc.topType : null),
      feedback,
    });
  }
  return out;
}

const SAMPLES = buildSamples();

// --- очередь (из образцов + тайминги/стадии) ---
function buildQueue(){
  return SAMPLES.filter(s=> s.status!=='queued' || true).map(s=>{
    const rng = rngFor(s.seqId+'_q');
    let stageIdx, stageStatuses;
    if (s.status==='done'){ stageIdx = PIPELINE_STAGES.length; }
    else if (s.status==='processing'){ stageIdx = between(rng,2,7); }
    else if (s.status==='error'){ stageIdx = between(rng,3,6); }
    else { stageIdx = 0; }

    const created = `07 июл. ${String(between(rng,9,17)).padStart(2,'0')}:${String(between(rng,10,59)).padStart(2,'0')}`;
    const startAt = s.status==='queued'? '—' : created.replace(/(\d+):(\d+)/,(m,h,mm)=>`${h}:${String((+mm+2)%60).padStart(2,'0')}`);
    const endAt   = s.status==='done'? created.replace(/(\d+):(\d+)/,(m,h,mm)=>`${(+h+1)}:${String((+mm+5)%60).padStart(2,'0')}`) : '—';

    const stages = PIPELINE_STAGES.map((name,idx)=>{
      let st='wait';
      if (s.status==='error' && idx===stageIdx) st='error';
      else if (idx<stageIdx) st='done';
      else if (idx===stageIdx && s.status==='processing') st='active';
      return { name, status: st, dur: idx<stageIdx? `${between(rngFor(s.seqId+idx),1,9)}м ${between(rngFor(s.seqId+idx+'s'),1,59)}с` : '' };
    });
    return { ...s, stageIdx, stages, created, startAt, endAt,
      progress: Math.round(stageIdx/PIPELINE_STAGES.length*100) };
  }).sort((a,b)=> b.id-a.id);
}
const QUEUE = buildQueue();

// --- хранилище (загрузки → образцы-папки) ---
function buildStorage(){
  const runs = ['R2026-021','R2026-020','R2026-019','R2026-018'];
  return runs.map((run, ri)=>{
    const rng = rngFor(run+'_st');
    const samplesInRun = SAMPLES.filter(s=> s.run===run);
    const files = samplesInRun.map(s=>({
      basename: s.seqId,
      sizeGb: between(rngFor(s.seqId+'_sz'), 3.2, 9.8, 1),
      kit: s.kit.label,
      ready: true,
      launched: s.status!=='queued',
      status: s.status,
      id: s.id,
    }));
    // пара «сырых, ещё не запущенных» папок в самой свежей загрузке
    if (ri===0){
      for (let k=0;k<2;k++){
        const sid = `EP_021_${90+k}_NEW${between(rng,100,999)}`;
        files.unshift({ basename:sid, sizeGb:between(rng,3.5,8.5,1), kit:'Vazyme', ready:true, launched:false, status:'new', id:'new'+k });
      }
    }
    return {
      run, ref:REF,
      created: `0${4-ri} июл. 2026, ${String(8+ri).padStart(2,'0')}:${String(between(rng,10,55)).padStart(2,'0')}`,
      files,
    };
  });
}

})();

/* ---------- форматтеры / бейджи ---------- */
const STATUS_META = {
  done:      { cls:'done',   label:'Завершён' },
  processing:{ cls:'proc',   label:'В обработке' },
  queued:    { cls:'queued', label:'В очереди' },
  error:     { cls:'error',  label:'Ошибка' },
  new:       { cls:'muted',  label:'Не запущен' },
};
function statusBadge(s){ const m=STATUS_META[s]||STATUS_META.new; return `<span class="badge badge--${m.cls}"><span class="dot"></span>${m.label}</span>`; }
function qcBadge(v){ return v==='Pass' ? `<span class="badge badge--pass">${icon('check')}Pass</span>` : `<span class="badge badge--fail">${icon('x')}Fail</span>`; }
const RISK_META = { high:{cls:'high',label:'Высокий риск'}, medium:{cls:'med',label:'Средний риск'}, low:{cls:'low',label:'Низкий риск'} };
function riskBadge(r){ const m=RISK_META[r]; return `<span class="badge badge--${m.cls}">${m.label}</span>`; }
function cancerLabel(key){ const t=CANCER_TYPES.find(t=>t.key===key); return t?t.label:'—'; }
function pct(v,dp=0){ return (v*100).toFixed(dp)+'%'; }

/* ---------- хитмап цвет: 0=синий … 1=красный ---------- */
function lerp(a,b,t){ return a+(b-a)*t; }
function heatColor(v){
  const c0=[44,111,179], cm=[244,242,238], c1=[192,57,43];
  let r,g,b;
  if (v<0.5){ const t=v/0.5; r=lerp(c0[0],cm[0],t); g=lerp(c0[1],cm[1],t); b=lerp(c0[2],cm[2],t); }
  else { const t=(v-0.5)/0.5; r=lerp(cm[0],c1[0],t); g=lerp(cm[1],c1[1],t); b=lerp(cm[2],c1[2],t); }
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}
function heatmapHtml(hm){
  const rows = hm.rows.map(row=>{
    const cells = row.values.map(v=>`<div class="hm-cell" style="background:${heatColor(v)}" title="${v.toFixed(2)}"></div>`).join('');
    return `<div class="hm-row"><div class="hm-label ${row.strong?'strong':''}">${row.label}</div>${cells}</div>`;
  }).join('');
  return `<div class="heatmap"><div class="heatmap__inner">${rows}</div></div>
    <div class="hm-scale"><span>0 · низкое</span><div class="hm-scale__bar"></div><span>1 · высокое</span>
    <span class="muted" style="margin-left:auto">${hm.N} маркерных регионов</span></div>`;
}

/* ---------- гейдж вероятности ---------- */
function gaugeHtml(prob, risk){
  const r=64, c=2*Math.PI*r, off=c*(1-prob);
  const col = risk==='high'?'var(--risk-high)':risk==='medium'?'var(--risk-med)':'var(--risk-low)';
  return `<div class="gauge"><svg width="150" height="150" viewBox="0 0 150 150">
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="13"/>
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
  </svg><div class="gauge__center"><div class="gauge__pct" style="color:${col}">${Math.round(prob*100)}%</div><div class="gauge__cap">онкопроцесс</div></div></div>`;
}

/* ---------- бары локализации ---------- */
function localizationBars(localization, topType){
  const entries = CANCER_TYPES.map(t=>({ ...t, v: localization[t.key] })).sort((a,b)=> b.v-a.v);
  return `<div class="locbars">` + entries.map((e,i)=>{
    const isTop = e.key===topType;
    const col = isTop ? 'var(--brand-600)' : 'var(--ink-3)';
    return `<div class="locbar ${isTop?'top':''}">
      <div class="locbar__name">${e.label}</div>
      <div class="locbar__track"><div class="locbar__fill" style="width:${Math.max(2,e.v*100).toFixed(0)}%;background:${col}"></div></div>
      <div class="locbar__val">${pct(e.v,1)}</div>
    </div>`;
  }).join('') + `</div>`;
}

/* ---------- тосты ---------- */
function toast(msg){
  let host = document.querySelector('.toast-host');
  if (!host){ host=document.createElement('div'); host.className='toast-host'; document.body.appendChild(host); }
  const t=document.createElement('div'); t.className='toast'; t.innerHTML=`${icon('circle-check')}<span>${msg}</span>`;
  host.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 3200);
}

/* ---------- утилиты ---------- */
function qs(name){ return new URLSearchParams(location.search).get(name); }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- локальное хранилище обратной связи (демо) ---------- */
const FB_KEY = 'epiprint_feedback';
function loadFeedback(){ try{ return JSON.parse(localStorage.getItem(FB_KEY)||'{}'); }catch(e){ return {}; } }
function saveFeedback(id, data){ const all=loadFeedback(); all[id]=data; localStorage.setItem(FB_KEY, JSON.stringify(all)); }
function getFeedback(sample){ const all=loadFeedback(); return all[sample.id] || sample.feedback; }

function buildReportDoc(s, variant){
  const compact = variant === 'compact';
  const sc = s.score, detected = sc.cancerProb > 0.5;
  const d = new Date(s.date+'T00:00:00');
  const fmtD = dt=>`${String(dt.getDate()).padStart(2,'0')}.${String(dt.getMonth()+1).padStart(2,'0')}.${dt.getFullYear()}`;
  const collect = new Date(d); collect.setDate(d.getDate()-3);
  const recv = new Date(d); recv.setDate(d.getDate()-2);
  const reportNo = 'EP-'+s.id+'/'+s.run.slice(2);
  const top2 = CANCER_TYPES.map(t=>({...t, v:sc.localization[t.key]})).sort((a,b)=>b.v-a.v).slice(0,2);
  const detColor = detected ? (sc.risk==='high' ? '#c0392b' : '#c8820a') : '#1a8a52';
  const riskWord = { high:'высокая', medium:'средняя', low:'низкая' }[sc.risk];

  const detectionText = detected
    ? `В образце свободно циркулирующей ДНК плазмы крови выявлен профиль метилирования, характерный для онкологического процесса. Расчётная вероятность наличия онкологического процесса — <b>${pct(sc.cancerProb)}</b>; категория риска — <b>${riskWord}</b>. Результат подлежит подтверждению методами клинического и инструментального обследования.`
    : `В образце свободно циркулирующей ДНК плазмы крови профиль метилирования, характерный для онкологического процесса, не выявлен. Расчётная вероятность наличия онкологического процесса — <b>${pct(sc.cancerProb)}</b>; категория риска — <b>${riskWord}</b>. Отрицательный результат не исключает наличия онкологического заболевания.`;

  // Интерпретация (в сжатом — с добавлением сути методики)
  let interpText = detected
    ? `Выявленный профиль метилирования ассоциирован с онкологическим процессом. Показано дообследование у профильного специалиста для верификации результата и установления окончательного диагноза.`
    : `Признаки онкологического процесса в исследованном образце не обнаружены. Рекомендовано продолжение планового скринингового наблюдения в соответствии с возрастом и факторами риска пациента.`;
  if (compact) interpText += ` Исследование выполнено методом анализа метилирования свободно циркулирующей ДНК плазмы крови (панель из ${s.heatmap.N} маркерных регионов, референсный геном GRCh38; секвенирование DNBSEQ/Illumina; контроль качества образца — ${s.qc.verdict==='Pass'?'пройден':'с замечаниями'}).`;

  // Ограничения интерпретации (в сжатом — с добавлением сути ограничений метода)
  let limitText = detected
    ? `Результат исследования не является установленным диагнозом и не может служить единственным основанием для его постановки. Окончательная интерпретация осуществляется лечащим врачом с учётом клинической картины и данных иных методов обследования.`
    : `Отрицательный результат не исключает наличия онкологического заболевания, в том числе локализаций, не входящих в исследуемую панель. Окончательная интерпретация осуществляется лечащим врачом с учётом клинической картины.`;
  if (compact) limitText += ` Исследование не заменяет стандартные методы обследования; диагностическая чувствительность снижается на ранних стадиях заболевания и при низкой доле опухолевой ДНК в образце; панель охватывает ограниченный перечень локализаций.`;

  // --- реквизиты образца: полный (тех.) vs сжатый (в стиле бланка Геномед) ---
  const infoFull = `
    <div class="rp-info">
      <div><h4>Пациент</h4><dl>
        <dt>Код</dt><dd>${s.patientCode}</dd>
        <dt>Индивидуальный №</dt><dd>${s.patientNo}</dd>
        <dt>Пол</dt><dd>${s.sex==='Ж'?'женский':'мужской'}</dd>
        <dt>Возраст</dt><dd>${s.age} лет</dd>
      </dl></div>
      <div><h4>Образец и метод</h4><dl>
        <dt>Идентификатор</dt><dd>${s.seqId}</dd>
        <dt>Биоматериал</dt><dd>плазма крови, cfDNA</dd>
        <dt>Метод · набор</dt><dd>${s.kit.method} · ${s.kit.label}</dd>
        <dt>Референсный геном</dt><dd>GRCh38 (${s.ref})</dd>
      </dl></div>
      <div><h4>Сроки исследования</h4><dl>
        <dt>Направитель</dt><dd style="font-family:var(--body)">${s.contractor}</dd>
        <dt>Забор материала</dt><dd>${fmtD(collect)}</dd>
        <dt>Поступление</dt><dd>${fmtD(recv)}</dd>
        <dt>Готовность</dt><dd>${fmtD(d)}</dd>
        <dt>Заключение №</dt><dd>${reportNo}</dd>
      </dl></div>
    </div>`;

  const infoCompact = `
    <div class="rp-gm-info">
      <div>
        <div class="r"><b>Номер договора:</b><span>Д-${s.id}/26</span></div>
        <div class="r"><b>Пациент:</b><span>${s.patientCode}</span></div>
        <div class="r"><b>Дата рождения · пол:</b><span>[дд.мм.гггг] · ${s.sex==='Ж'?'жен.':'муж.'}</span></div>
        <div class="r"><b>Вид биоматериала:</b><span>плазма крови (cfDNA)</span></div>
        <div class="r"><b>Вид исследования:</b><span>EpiPrint — метилирование cfDNA (MCED)</span></div>
      </div>
      <div>
        <div class="r"><b>Дата забора материала:</b><span>${fmtD(collect)}</span></div>
        <div class="r"><b>Поступление в лабораторию:</b><span>${fmtD(recv)}</span></div>
        <div class="r"><b>Дата готовности:</b><span>${fmtD(d)}</span></div>
        <div class="r"><b>Заключение №:</b><span>${reportNo}</span></div>
      </div>
    </div>`;

  const infoBlock = compact ? infoCompact : infoFull;

  const predictionBlock = detected ? `
    <div class="rp-sec">
      <div class="rp-sec__tab" style="background:var(--pred)">Локализация</div>
      <div class="rp-sec__body">
        <div class="pred-h">Предполагаемая локализация источника сигнала</div>
        <hr class="pred-rule">
        <div class="pred-grid">
          <div class="cso-card">
            <div class="cso-card__hd">Источник сигнала</div>
            <div class="cso-card__bd">

            <p>Предполагаемая локализация источника сигнала указывает ткань или орган, ассоциированные с выявленным профилем метилирования, и предназначена для определения приоритетного направления диагностического поиска.</p>
            <p>Протяжённость индикатора отражает степень соответствия профиля метилирования опухолям указанной локализации: большей протяжённости соответствует более высокая степень соответствия. Диагностическую оценку следует начинать с наиболее вероятной локализации.</p>
            <p class="it">Протяжённость индикатора не отражает вероятность наличия злокачественного новообразования и не заменяет топической диагностики.</p>
          </div>
        </div>
      </div>
    </div>`
  : `
    <div class="rp-sec">
      <div class="rp-sec__tab" style="background:var(--pred)">Локализация</div>
      <div class="rp-sec__body">
        <div class="pred-h">Локализация источника сигнала</div>
        <hr class="pred-rule">
        <p style="font-size:9.4px;color:#6b7280;line-height:1.5;margin:0;text-align:justify">Определение локализации источника сигнала не проводится при отсутствии онкологического сигнала.</p>
      </div>
    </div>`;

  // блок «Ограничения метода / Методика» — только в полном варианте
  const fineBlock = compact ? '' : `
    <div class="rp-fine">
      <div><h6>Ограничения метода</h6><ul>
        <li>Исследование не заменяет установленный клинический диагноз и требует подтверждения стандартными методами обследования.</li>
        <li>Диагностическая чувствительность метода снижается на ранних стадиях заболевания и при низкой доле опухолевой ДНК в образце.</li>
        <li>Панель охватывает ограниченный перечень локализаций; отдельные нозологические формы могут не выявляться.</li>
      </ul></div>
      <div><h6>Методика</h6><p>Исследование профиля метилирования свободно циркулирующей ДНК плазмы крови по панели из ${s.heatmap.N} маркерных регионов. Референсный геном — GRCh38 (${s.ref}); платформа секвенирования — DNBSEQ/Illumina. Контроль качества образца — <b>${s.qc.verdict==='Pass'?'пройден':'с замечаниями'}</b>. Оценка вероятности выполнена путём сопоставления профиля метилирования образца с референсными профилями.</p></div>
    </div>`;

  return `
  <div class="doc" style="--det:${detColor};--pred:#463c8c">
    <div class="gm-head">
      <div class="gm-logo">${genomedLogoSVG()}</div>
      <div class="gm-org">
        <div class="gm-reg"><span>ООО «ГЕНОМЕД»</span><span>ИНН/КПП 7701759381/770101001</span><span>ОГРН 1077763509977</span></div>
        <div class="gm-lab">ЛАБОРАТОРИЯ МОЛЕКУЛЯРНОЙ ПАТОЛОГИИ</div>
        <div class="gm-addr">Юр. адрес: 105005, Россия, г. Москва, ул. Бауманская, д. 50/12, стр. 1</div>
      </div>
      <div class="gm-contacts">
        <div>${miniIcon(_IC_PHONE)} +7 (495) 660-83-77</div>
        <div>${miniIcon(_IC_PHONE)} +7 800-333-45-38</div>
        <div>${miniIcon(_IC_MAIL)} callcenter@genomed.ru</div>
        <div>${miniIcon(_IC_GLOBE)} www.genomed.ru</div>
      </div>
    </div>
    <hr class="gm-rule"><hr class="gm-rule2">

    <div class="rp-titleblock">
      <div class="rp-title">ЗАКЛЮЧЕНИЕ</div>
      <div class="rp-subtitle">по результатам исследования метилирования свободно циркулирующей ДНК · тест <b>EpiPrint</b> (ранняя диагностика онкологического процесса)</div>
    </div>

    ${infoBlock}

    <div class="rp-sec">
      <div class="rp-sec__tab" style="background:var(--det)">Выявление</div>
      <div class="rp-sec__body">
        <div class="resultbox">
          <div class="resultbox__legend">Результат</div>
          <div class="result-icon">${detected ? '!' : icon('check')}</div>
          <div>
            <div class="result-h">${detected ? 'Онкологический сигнал обнаружен' : 'Онкологический сигнал не обнаружен'}</div>
            <p class="result-p">${detectionText}</p>
          </div>
        </div>
        <div class="rp-two">
          <div><h5>${icon('circle-check')} Интерпретация</h5><p>${interpText}</p></div>
          <div><h5>${icon('alert-triangle')} Ограничения интерпретации</h5><p>${limitText}</p></div>
        </div>
      </div>
    </div>

    ${predictionBlock}

    ${fineBlock}

    <div class="rp-sign">
      <div>
        <div class="rp-sign__who">Заведующий лабораторией</div>
        <div class="rp-sign__line">
          <div class="rp-sign__name">[И. О. Фамилия]</div>
          <div class="rp-sign__role">врач клинической лабораторной диагностики</div>
        </div>
        <div class="rp-sign__who" style="margin-top:8px">Дата выдачи: ${fmtD(d)}</div>
      </div>
      <div class="seal">${reportSealSVG()}</div>
    </div>

    <div class="rp-foot">
      <div>ООО «Геномед» · Лаборатория молекулярной патологии · г. Москва, ул. Бауманская, д. 50/12, стр. 1</div>
      <div style="text-align:right">Конфиденциально · содержит персональные данные<br>Заключение № ${reportNo} · сформировано ЛИС EpiPrint</div>
    </div>
  </div>`;
}

</script>
<script>
/* ============================================================
   EpiPrint — единый SPA-слой (hash-роутинг).
   Разделы: Обзор · Обработка · Результаты · Заключения · Система.
   ============================================================ */

let liveTimer = null;
let samplesSearch = '';
function stopTimers(){ if (liveTimer){ clearInterval(liveTimer); liveTimer=null; } }
function riskColor(r){ return r==='high'?'var(--risk-high)':r==='medium'?'var(--risk-med)':'var(--risk-low)'; }
function tile(label,value,ic,sub){ return `<div class="stat"><div class="stat__label"><span class="ic">${icon(ic)}</span>${label}</div><div class="stat__value">${value}</div><div class="stat__sub">${sub}</div></div>`; }
const STUDY_TYPE = 'Метилирование cfDNA · ранняя диагностика онкологического процесса';
const BIOMATERIAL = 'Плазма крови (cfDNA)';

const NAV_SPA = [
  { route:'dashboard',   label:'Обзор',       icon:'layout-dashboard' },
  { route:'processing',  label:'Обработка',   icon:'list-checks' },
  { route:'results',     label:'Пациенты',    icon:'microscope' },
  { route:'conclusions', label:'Заключения',  icon:'file-text' },
  { group:'Служебное' },
  { route:'users',       label:'Пользователи', icon:'users' },
];

function renderShellSPA(activeNav, title){
  const newCount = STORAGE.reduce((a,r)=> a + r.files.filter(f=>!f.launched).length, 0);
  const activeCount = SAMPLES.filter(s=> s.status==='processing'||s.status==='queued').length;
  const nav = NAV_SPA.map(n=>{
    if (n.group) return `<div class="nav__group">${n.group}</div>`;
    let badge='';
    if (n.route==='processing' && (newCount+activeCount)) badge = `<span class="nav__badge">${newCount+activeCount}</span>`;
    return `<a class="nav__item ${activeNav===n.route?'is-active':''}" href="#/${n.route}">${icon(n.icon)}<span>${n.label}</span>${badge}</a>`;
  }).join('');

  document.getElementById('sidebar').innerHTML = `
    <div class="brand">
      <div class="brand__mark">${icon('fingerprint')}</div>
      <div><div class="brand__name">EpiPrint</div><div class="brand__sub">cfDNA Methylation</div></div>
    </div>
    <nav class="nav">${nav}</nav>
    <div class="sidebar__foot">Прототип · v0.1 · демо-данные</div>`;

  document.getElementById('topbar').innerHTML = `
    <div class="topbar__title">${title}</div>
    <div class="topbar__spacer"></div>
    <label class="topbar__search">${icon('search')}<input placeholder="Поиск по SeqID…" id="globalSearch"></label>
    <div class="topbar__user"><div class="avatar">${CURRENT_USER.initials}</div></div>`;
  const gs = document.getElementById('globalSearch');
  gs.addEventListener('keydown', e=>{ if(e.key==='Enter' && gs.value.trim()){ samplesSearch=gs.value.trim(); location.hash='#/results'; }});
}

/* ================= Обзор (сводка за 7 дней) ================= */
function renderDashboard(param, view){
  const done = SAMPLES.filter(s=>s.status==='done');
  const activeN = SAMPLES.filter(s=> s.status==='processing'||s.status==='queued').length;
  const newN = STORAGE.reduce((a,r)=> a + r.files.filter(f=>!f.launched).length, 0);
  const passN = done.filter(s=>s.qc.verdict==='Pass').length, failN = done.length-passN;
  const processed7d = STATS.throughput7d.reduce((a,b)=>a+b,0);
  const recent = [...SAMPLES].sort((a,b)=>b.id-a.id).slice(0,7);

  view.innerHTML = `
    <div class="page-head"><div><div class="eyebrow">Сводка</div><h1>Обзор</h1></div>
      <a class="btn btn--primary" href="#/processing">${icon('play')} К обработке${newN?' · '+newN:''}</a></div>

    <div class="grid grid-4" style="margin-bottom:16px">
      ${tile('Обработано за 7 дней', processed7d, 'circle-check', 'завершённых образцов')}
      ${tile('В работе', activeN, 'clock', 'в обработке и очереди')}
      ${tile('Осталось запустить', newN, 'folder', 'новых образцов')}
      ${tile('Контроль качества', passN+' / '+failN, 'shield-check', 'pass / fail')}
    </div>

    <div class="card"><div class="card__head"><div class="section-title">${icon('microscope')} Последние образцы</div>
      <a class="btn btn--sm btn--ghost" href="#/results">Все результаты</a></div>
      <div class="table-wrap"><table class="tbl"><thead><tr>
        <th>SeqID</th><th>Пациент</th><th>Статус</th><th>QC</th><th>Скор (ML)</th><th>Локализация</th><th>Дата</th>
      </tr></thead><tbody>${recent.map(s=>`
        <tr class="clickable" onclick="location.hash='#/sample/${s.id}'">
          <td class="id">${s.seqId}</td><td style="font-size:.82rem">${s.fio}</td><td>${statusBadge(s.status)}</td>
          <td>${s.status==='done'?qcBadge(s.qc.verdict):'<span class="muted">—</span>'}</td>
          <td>${s.score?`<b style="color:${riskColor(s.score.risk)}">${pct(s.score.cancerProb)}</b>`:'<span class="muted">—</span>'}</td>
          <td>${s.score&&s.score.cancerProb>0.5?cancerLabel(s.score.topType):'<span class="muted">—</span>'}</td>
          <td class="mono muted">${s.date}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ================= Обработка (запуск + очередь) ================= */
function renderProcessing(param, view){
  const selected = new Set();
  const newList = ()=>{ const a=[]; STORAGE.forEach(r=> r.files.forEach(f=>{ if(!f.launched) a.push({run:r.run, f}); })); return a; };

  view.innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow">Обработка образцов</div><h1>Обработка</h1>
        <p class="muted">Запуск и мониторинг обработки образцов.</p></div>
      <button class="btn" id="refreshBtn">${icon('refresh-cw')} Обновить</button>
    </div>

    <div class="card">
      <div class="card__head">
        <div class="section-title">${icon('folder')} К запуску <span class="badge badge--warn" id="newCount"></span></div>
        <div class="hstack">
          <label class="hstack" style="font-size:.82rem"><input type="checkbox" class="checkbox" id="selectAll"> Выбрать все</label>
          <button class="btn btn--sm" id="runSelBtn" disabled>${icon('play')} Запустить выбранные</button>
          <button class="btn btn--primary btn--sm" id="runAllBtn">${icon('play')} Запустить все</button>
        </div>
      </div>
      <div class="table-wrap"><table class="tbl">
        <thead><tr><th style="width:34px"></th><th>SeqID</th><th>Размер</th><th>Статус</th></tr></thead>
        <tbody id="newRows"></tbody>
      </table></div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card__head">
        <div class="section-title">${icon('list-checks')} Очередь обработки</div>
        <div class="hstack"><span class="chip" id="liveChip"></span>
          <label class="hstack" style="font-size:.85rem;font-weight:600"><input type="checkbox" class="checkbox" id="autoToggle" checked> Автообновление</label></div>
      </div>
      <div style="padding:12px 18px 0"><div class="segmented" id="qfilter">
        <button data-f="all" class="is-active">Все</button><button data-f="processing">В обработке</button>
        <button data-f="queued">В очереди</button><button data-f="done">Завершён</button><button data-f="error">Ошибка</button>
      </div></div>
      <div class="table-wrap"><table class="tbl"><thead><tr>
        <th>ID</th><th>Создан</th><th>SeqID</th><th style="min-width:180px">Стадии анализа</th><th>Статус</th><th>Логи</th>
      </tr></thead><tbody id="qrows"></tbody></table></div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card__head" id="archHead" style="cursor:pointer">
        <div class="section-title">${icon('hard-drive')} Архив загрузок</div>
        <span class="hstack muted" style="font-size:.8rem"><span id="archMeta"></span><span id="archChev" style="display:inline-flex;transition:transform .15s">${icon('chevron-right')}</span></span>
      </div>
      <div id="archBody" style="display:none"></div>
    </div>`;

  const newRowsEl = view.querySelector('#newRows');
  function updSel(){ const n=selected.size; view.querySelector('#runSelBtn').disabled=n===0; view.querySelector('#runSelBtn').innerHTML=`${icon('play')} Запустить выбранные${n?' · '+n:''}`; }
  function drawNew(){
    const list = newList();
    view.querySelector('#newCount').textContent = list.length;
    view.querySelector('#runAllBtn').disabled = list.length===0;
    view.querySelector('#selectAll').disabled = list.length===0;
    newRowsEl.innerHTML = list.length ? list.map(({f})=>`
      <tr>
        <td><input type="checkbox" class="checkbox nchk" data-name="${f.basename}" ${selected.has(f.basename)?'checked':''}></td>
        <td class="id">${icon('folder')} ${f.basename}</td>
        <td class="num muted">${f.sizeGb} ГБ</td>
        <td><span class="badge badge--muted"><span class="dot"></span>Готов к запуску</span></td>
      </tr>`).join('')
      : `<tr><td colspan="4" class="tbl__empty">${icon('check')} Новых образцов нет — всё запущено</td></tr>`;
    newRowsEl.querySelectorAll('.nchk').forEach(chk=> chk.addEventListener('change', ()=>{ chk.checked?selected.add(chk.dataset.name):selected.delete(chk.dataset.name); updSel(); }));
    updSel();
  }
  function drawArch(){
    view.querySelector('#archMeta').textContent = `${STORAGE.length} загрузок · `;
    view.querySelector('#archBody').innerHTML = STORAGE.map(r=>{
      const total=r.files.length, nw=r.files.filter(f=>!f.launched).length;
      const rows = r.files.map(f=>`<tr>
        <td class="id">${icon('folder')} ${f.basename}</td>
        <td class="num muted">${f.sizeGb} ГБ</td>
        <td>${f.launched? statusBadge(f.status):'<span class="badge badge--muted"><span class="dot"></span>Готов</span>'}</td></tr>`).join('');
      return `<div style="border-top:1px solid var(--line-2)">
        <div class="hstack" style="padding:11px 18px;justify-content:space-between">
          <div class="hstack"><b class="mono">${r.run}</b><span class="chip">${r.ref}</span>${nw?`<span class="badge badge--warn">${nw} к запуску</span>`:`<span class="badge badge--pass">${icon('check')}запущены</span>`}</div>
          <span class="muted" style="font-size:.78rem">${r.created} · ${total} обр.</span>
        </div>
        <div class="table-wrap" style="padding:0 10px 10px"><table class="tbl">
          <thead><tr><th>SeqID</th><th>Размер</th><th>Статус</th></tr></thead><tbody>${rows}</tbody></table></div>
      </div>`;
    }).join('');
  }
  function launch(names){
    if(!names.length){ toast('Нет готовых к запуску образцов'); return; }
    STORAGE.forEach(r=> r.files.forEach(f=>{ if(names.includes(f.basename)){ f.launched=true; f.status='queued'; }}));
    selected.clear(); view.querySelector('#selectAll').checked=false;
    drawNew(); drawArch();
    toast(`${names.length} образц(ов) поставлено в очередь обработки`);
  }
  view.querySelector('#selectAll').addEventListener('change', e=>{
    newRowsEl.querySelectorAll('.nchk').forEach(chk=>{ chk.checked=e.target.checked; chk.checked?selected.add(chk.dataset.name):selected.delete(chk.dataset.name); }); updSel();
  });
  view.querySelector('#runSelBtn').addEventListener('click', ()=> launch([...selected]));
  view.querySelector('#runAllBtn').addEventListener('click', ()=> launch(newList().map(x=>x.f.basename)));
  view.querySelector('#refreshBtn').addEventListener('click', ()=> toast('Обновлено'));
  view.querySelector('#archHead').addEventListener('click', ()=>{
    const b=view.querySelector('#archBody'), open=b.style.display!=='none';
    b.style.display=open?'none':''; view.querySelector('#archChev').style.transform=open?'':'rotate(90deg)';
  });

  const Q = JSON.parse(JSON.stringify(QUEUE));
  let filter='all', lastUpdate=0;
  const openStages = new Set();
  const stStatus = (q,i)=> (q.status==='error'&&i===q.stageIdx)?'error' : i<q.stageIdx?'done' : (i===q.stageIdx&&q.status==='processing')?'active' : 'wait';
  const pips = q=>`<div class="stages">`+PIPELINE_STAGES.map((_,i)=>`<span class="stage-pip ${stStatus(q,i)==='wait'?'':stStatus(q,i)}"></span>`).join('')+`</div>
      <div class="muted mono" style="font-size:.7rem;margin-top:3px">${q.status==='processing'?PIPELINE_STAGES[q.stageIdx]:q.status==='error'?'⚠ '+PIPELINE_STAGES[q.stageIdx]:q.status==='done'?'готово':'ожидает'} <span style="opacity:.6">${icon('chevron-right')}</span></div>`;
  function stageDetail(q){
    const rng = rngFor(q.seqId+'_stg');
    const dm = q.created.match(/(\d+)\s+(\S+?)\.?\s+(\d+):(\d+)/);
    let day=dm?dm[1]:'09', mon=dm?dm[2]:'июл', hh=dm?+dm[3]:15, mm=dm?+dm[4]:0, ss=between(rng,0,59);
    return PIPELINE_STAGES.map((name,i)=>{
      const st = stStatus(q,i);
      let timeStr='', durStr='';
      if(st==='done'){
        timeStr = `${day} ${mon}. ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
        const dMin=between(rng,0,26), dSec=between(rng,1,59);
        durStr = dMin? `${dMin} мин` : `${dSec} сек`;
        mm+=dMin; ss=(ss+dSec)%60; while(mm>=60){mm-=60;hh++;}
      } else if(st==='active'){ timeStr='выполняется…'; }
      else if(st==='error'){ timeStr='ошибка'; }
      else { timeStr='ожидает'; }
      const mark = st==='done'?icon('check'):st==='error'?icon('x'):st==='active'?'':(i+1);
      return `<div class="stage-row" style="padding:3px 0"><div class="stage-ic ${st}" style="width:19px;height:19px;font-size:.6rem">${mark}</div>
        <div class="stage-name" style="font-size:.8rem">${name}</div><div class="stage-time">${timeStr}${durStr?' · '+durStr:''}</div></div>`;
    }).join('');
  }
  const logs = `<div class="wrap-gap">
    <a class="chip" onclick="toast('Скачивание status.log')" style="cursor:pointer">status.log</a>
    <a class="chip" onclick="toast('Скачивание err.log')" style="cursor:pointer">err.log</a></div>`;
  function drawQ(){
    const rows = view.querySelector('#qrows');
    // запоминаем раскрытые стадии перед перерисовкой
    rows.querySelectorAll('details[data-qid]').forEach(d=>{ if(d.open) openStages.add(d.dataset.qid); else openStages.delete(d.dataset.qid); });
    const list = Q.filter(q=> filter==='all'||q.status===filter);
    rows.innerHTML = list.length? list.map(q=>`
      <tr class="${q.status==='done'?'clickable':''}" ${q.status==='done'?`onclick="location.hash='#/sample/${q.id}'"`:''}>
        <td class="mono muted">${q.id}</td><td class="mono" style="font-size:.78rem">${q.created}</td>
        <td class="id">${q.seqId}</td>
        <td><details class="dd dd--stages" data-qid="${q.id}" ${openStages.has(String(q.id))?'open':''} onclick="event.stopPropagation()"><summary>${pips(q)}</summary>
          <div class="stage-list" style="margin-top:6px">${stageDetail(q)}</div></details></td>
        <td>${statusBadge(q.status)}</td><td>${logs}</td></tr>`).join('')
      : `<tr><td colspan="6" class="tbl__empty">Нет образцов в этом статусе</td></tr>`;
  }
  function chip(){ const a=Q.filter(q=>q.status==='processing').length; view.querySelector('#liveChip').innerHTML=`<span class="live-dot"></span> ${a} в работе · обновлено ${lastUpdate}с назад`; }
  function tick(force){
    const auto = view.querySelector('#autoToggle').checked;
    if(!auto && !force){ lastUpdate+=2; chip(); return; }
    lastUpdate=0;
    Q.forEach(q=>{ if(q.status==='processing' && Math.random()>0.4){ q.stageIdx++;
      if(q.stageIdx>=PIPELINE_STAGES.length){ q.status='done'; q.stageIdx=PIPELINE_STAGES.length;
        const nx=Q.find(x=>x.status==='queued'); if(nx){ nx.status='processing'; nx.stageIdx=1; } } } });
    drawQ(); chip();
  }
  view.querySelectorAll('#qfilter button').forEach(b=> b.addEventListener('click', ()=>{
    view.querySelectorAll('#qfilter button').forEach(x=>x.classList.remove('is-active')); b.classList.add('is-active'); filter=b.dataset.f; drawQ();
  }));
  drawNew(); drawArch(); drawQ(); chip();
  liveTimer = setInterval(()=>{ lastUpdate+=2; if(view.querySelector('#autoToggle') && view.querySelector('#autoToggle').checked) tick(); else chip(); }, 2000);
}

/* ================= Результаты (Образцы + Контроль качества) ================= */
function renderResults(param, view, sub){
  let tab = sub==='qc' ? 'qc' : 'reg';
  view.innerHTML = `
    <div class="page-head"><div><div class="eyebrow">Реестр</div><h1>Пациенты</h1>
      <p class="muted">Реестр пациентов и контроль качества.</p></div></div>
    <div class="subtabs" id="rtabs">
      <button data-t="reg">${icon('microscope')} Реестр</button>
      <button data-t="qc">${icon('shield-check')} Контроль качества</button>
    </div>
    <div id="rcontent"></div>`;
  const content = view.querySelector('#rcontent');
  function setTab(t){
    tab=t; view.querySelectorAll('#rtabs button').forEach(b=> b.classList.toggle('is-active', b.dataset.t===t));
    if (t==='qc') drawQCTable(content); else drawPatientsTable(content);
  }
  view.querySelectorAll('#rtabs button').forEach(b=> b.addEventListener('click', ()=> setTab(b.dataset.t)));

}

function drawPatientsTable(container){
  container.innerHTML = `
    <div class="toolbar">
      <label class="topbar__search" id="searchLabel" style="min-width:280px"><input class="input" style="border:0;padding:0;width:100%" placeholder="ФИО, SeqID, код, ERP…" id="q"></label>
      <select class="select" id="fStatus"><option value="">Все статусы</option><option value="done">Завершён</option><option value="processing">В обработке</option><option value="queued">В очереди</option><option value="error">Ошибка</option></select>
      <select class="select" id="fRisk"><option value="">Любой риск</option><option value="high">Высокий</option><option value="medium">Средний</option><option value="low">Низкий</option></select>
      <div class="toolbar__spacer"></div><span class="badge badge--muted" id="count"></span>
    </div>
    <div class="card"><div class="table-wrap"><table class="tbl"><thead><tr>
      <th>ID</th><th>ФИО пациента</th><th>Контрагент</th><th>ERP заказ</th><th>SeqID</th><th>Статус</th><th>QC</th><th>Скор (ML)</th><th>Заключение</th><th>Дата</th>
    </tr></thead><tbody id="srows"></tbody></table></div></div>`;
  container.querySelector('#searchLabel').insertAdjacentHTML('afterbegin', icon('search'));
  const qInput = container.querySelector('#q'); qInput.value = samplesSearch || '';
  const resultCell = s=>{ if(!s.score) return '<span class="muted">—</span>';
    return `<b style="color:${riskColor(s.score.risk)}">${pct(s.score.cancerProb)}</b> ${riskBadge(s.score.risk)}`; };
  const conclCell = s=> s.status==='done'
    ? `<a class="chip" href="#/report/${s.id}" onclick="event.stopPropagation()">${icon('file-text')} открыть</a>`
    : '<span class="muted">—</span>';
  function apply(){
    const q=qInput.value.trim().toLowerCase(); samplesSearch=qInput.value.trim();
    const st=container.querySelector('#fStatus').value, risk=container.querySelector('#fRisk').value;
    const list = SAMPLES.filter(s=>{
      if(q && !(s.seqId.toLowerCase().includes(q)||s.patientCode.toLowerCase().includes(q)||String(s.patientNo).toLowerCase().includes(q)||s.fio.toLowerCase().includes(q))) return false;
      if(st && s.status!==st) return false;
      if(risk && (!s.score||s.score.risk!==risk)) return false; return true;
    }).sort((a,b)=>b.id-a.id);
    container.querySelector('#count').textContent=`Показано: ${list.length} из ${SAMPLES.length}`;
    container.querySelector('#srows').innerHTML = list.length? list.map(s=>`
      <tr class="clickable" onclick="location.hash='#/sample/${s.id}'">
        <td class="mono muted">${s.id}</td>
        <td style="font-size:.86rem">${s.fio}<div class="muted" style="font-size:.72rem">${s.sex}, ${s.age} л.</div></td>
        <td style="font-size:.8rem">${s.contractor}</td>
        <td class="mono muted">${s.patientNo}</td>
        <td class="id">${s.seqId}</td>
        <td>${statusBadge(s.status)}</td><td>${s.status==='done'?qcBadge(s.qc.verdict):'<span class="muted">—</span>'}</td>
        <td class="nowrap">${resultCell(s)}</td>
        <td>${conclCell(s)}</td><td class="mono muted">${s.date}</td></tr>`).join('')
      : `<tr><td colspan="10" class="tbl__empty">Ничего не найдено</td></tr>`;
  }
  qInput.addEventListener('input', apply);
  ['fStatus','fRisk'].forEach(id=> container.querySelector('#'+id).addEventListener('change', apply));
  apply();
}

function drawQCTable(container){
  const done = SAMPLES.filter(s=>s.status==='done');
  const passN = done.filter(s=>s.qc.verdict==='Pass').length, failN=done.length-passN;
  container.innerHTML = `
    <div class="grid grid-4" style="margin-bottom:16px">
      ${tile('Завершено', done.length, 'shield-check', 'с рассчитанным QC')}
      ${tile('Pass', passN, 'circle-check', Math.round(passN/done.length*100)+'% потока')}
      ${tile('Fail', failN, 'alert-triangle', 'требуют внимания')}
      ${tile('Ср. конверсия', (done.reduce((a,s)=>a+s.qc.metrics[0].value,0)/done.length).toFixed(2)+'%', 'flask', 'бисульфитная конверсия')}
    </div>
    <div class="toolbar"><div class="segmented" id="qcfilter"><button data-f="all" class="is-active">Все</button><button data-f="Pass">Pass</button><button data-f="Fail">Fail</button></div>
      <div class="toolbar__spacer"></div><label class="topbar__search" id="qcSearch" style="min-width:220px"><input class="input" style="border:0;padding:0;width:100%" placeholder="SeqID…" id="qcq"></label></div>
    <div class="card"><div class="table-wrap"><table class="tbl"><thead><tr>
      <th>SeqID</th><th>Результат</th><th>failed metrics</th><th class="num">Конверсия</th><th class="num">Глубина покрытия</th><th class="num">Равномерность</th>
      <th class="num">CpG ≥5×</th><th class="num">Дупликейты</th><th class="num">Вставка</th><th class="num">Картир.</th><th class="num">Опух. фр.</th>
    </tr></thead><tbody id="qcrows"></tbody></table></div></div>`;
  container.querySelector('#qcSearch').insertAdjacentHTML('afterbegin', icon('search'));
  let filter='all';
  const mv=(s,k)=>s.qc.metrics.find(x=>x.key===k);
  const cell=m=>{ if(!m) return '<td class="num muted">—</td>'; const col=m.threshold==='справочно'?'var(--ink-2)':m.pass?'var(--ink)':'var(--fail)'; return `<td class="num" style="color:${col};font-weight:${m.pass?400:700}">${m.value}</td>`; };
  function draw(){
    const q=container.querySelector('#qcq').value.trim().toLowerCase();
    const list = done.filter(s=>(filter==='all'||s.qc.verdict===filter)&&(!q||s.seqId.toLowerCase().includes(q)));
    container.querySelector('#qcrows').innerHTML = list.length? list.map(s=>`
      <tr class="clickable" onclick="location.hash='#/sample/${s.id}'"><td class="id">${s.seqId}</td><td>${qcBadge(s.qc.verdict)}</td>
        <td style="font-size:.78rem;color:var(--fail)">${s.qc.failed.length?s.qc.failed.map(f=>f.split(' ').slice(0,2).join(' ')).join(', '):'<span class="muted">—</span>'}</td>
        ${cell(mv(s,'conversion'))}${cell(mv(s,'meanDepth'))}${cell(mv(s,'uniformity'))}${cell(mv(s,'cpgCov'))}${cell(mv(s,'dup'))}${cell(mv(s,'insert'))}${cell(mv(s,'mapped'))}${cell(mv(s,'tumorFrac'))}</tr>`).join('')
      : `<tr><td colspan="11" class="tbl__empty">Ничего не найдено</td></tr>`;
  }
  container.querySelectorAll('#qcfilter button').forEach(b=> b.addEventListener('click', ()=>{ container.querySelectorAll('#qcfilter button').forEach(x=>x.classList.remove('is-active')); b.classList.add('is-active'); filter=b.dataset.f; draw(); }));
  container.querySelector('#qcq').addEventListener('input', draw);
  draw();
}

/* ================= Заключения ================= */
function renderConclusions(param, view){
  const done = SAMPLES.filter(s=>s.status==='done' && s.score);
  const posEx = done.find(s=>s.score.cancerProb>0.5 && s.qc.verdict==='Pass') || done.find(s=>s.score.cancerProb>0.5);
  const negEx = done.find(s=>s.score.cancerProb<=0.5);
  const exCard = (s, positive)=>`
    <a class="card clickable" href="#/report/${s.id}" style="text-decoration:none;color:inherit;display:block">
      <div class="card__body" style="display:flex;align-items:center;gap:14px">
        <div style="width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:${positive?'var(--fail-bg)':'var(--pass-bg)'};color:${positive?'var(--fail)':'var(--pass)'}">${positive?icon('alert-triangle'):icon('circle-check')}</div>
        <div><div style="font-family:var(--disp);font-weight:800;font-size:1rem">${positive?'Онкологический сигнал обнаружен':'Онкологический сигнал не обнаружен'}</div>
          <div class="muted" style="font-size:.82rem">Пример заключения · ${s.seqId}</div></div>
        <div class="spacer"></div>${icon('chevron-right')}
      </div></a>`;

  view.innerHTML = `
    <div class="page-head"><div><div class="eyebrow">Заключения</div><h1>Заключения</h1>
      <p class="muted">Лабораторные заключения по образцам.</p></div></div>
    <div class="grid grid-2" style="margin-bottom:18px">${posEx?exCard(posEx,true):''}${negEx?exCard(negEx,false):''}</div>
    <div class="card"><div class="card__head"><div class="section-title">${icon('file-text')} Все заключения</div>
      <span class="badge badge--muted">${done.length}</span></div>
      <div class="table-wrap"><table class="tbl"><thead><tr>
        <th>SeqID</th><th>Пациент</th><th>Результат</th><th>Риск</th><th>Дата</th><th></th>
      </tr></thead><tbody>${done.sort((a,b)=>b.id-a.id).map(s=>{
        const det = s.score.cancerProb>0.5;
        return `<tr class="clickable" onclick="location.hash='#/report/${s.id}'">
          <td class="id">${s.seqId}</td><td style="font-size:.82rem">${s.fio}</td>
          <td><span class="badge badge--${det?'fail':'pass'}">${det?icon('alert-triangle')+'обнаружен':icon('check')+'не обнаружен'}</span></td>
          <td>${riskBadge(s.score.risk)}</td><td class="mono muted">${s.date}</td>
          <td class="text-right"><a class="btn btn--sm btn--ghost" href="#/report/${s.id}" onclick="event.stopPropagation()">Открыть ${icon('chevron-right')}</a></td></tr>`;
      }).join('')}</tbody></table></div></div>`;
}

function renderSampleDetail(param, view){
  const s = sampleById(param) || SAMPLES[0];
  const d = new Date(s.date+'T00:00:00');
  const fmtD = dt=>`${String(dt.getDate()).padStart(2,'0')}.${String(dt.getMonth()+1).padStart(2,'0')}.${dt.getFullYear()}`;
  const collect = new Date(d); collect.setDate(d.getDate()-3);
  const dob = `[дд.мм.]${2026 - s.age}`;

  const header = `
    <a class="btn btn--sm btn--ghost" href="#/results" style="margin-bottom:14px">${icon('arrow-left')} К результатам</a>

            <a class="btn btn--primary" href="#/report/${s.id}">${icon('file-text')} Предпросмотр заключения</a></div>
        </div>
        <hr class="divider">
        <div class="grid grid-3" style="gap:18px">

          <dl class="kv"><dt>Номер договора</dt><dd>Д-${s.id}/26</dd>
            <dt>Контрагент</dt><dd style="font-family:var(--body)">${s.contractor}</dd>
            <dt>Направительный диагноз</dt><dd style="font-family:var(--body)">—</dd>
            <dt>Дата забора</dt><dd>${fmtD(collect)}</dd></dl>
          <dl class="kv"><dt>Вид исследования</dt><dd style="font-family:var(--body)">${STUDY_TYPE}</dd>

            <dt>Референсный геном</dt><dd>GRCh38 (${s.ref})</dd>
            <dt>Дата готовности</dt><dd>${fmtD(d)}</dd></dl>
        </div>
      </div>
    </div>`;

  if (s.status!=='done'){
    const stageIdx = s.status==='processing'?4 : s.status==='error'?3 : 0;
    view.innerHTML = header + `
      <div class="card"><div class="card__body">
        <div class="section-title" style="margin-bottom:14px">${icon('clock')} Обработка образца</div>
        <div class="stage-list">${PIPELINE_STAGES.map((name,i)=>{
          let st=i<stageIdx?'done':(i===stageIdx&&s.status==='processing')?'active':(i===stageIdx&&s.status==='error')?'error':'wait';
          const mark = st==='done'?icon('check'):st==='error'?icon('x'):st==='active'?'':(i+1);
          return `<div class="stage-row"><div class="stage-ic ${st}">${mark}</div><div class="stage-name">${name}</div>

        <div class="card__body">
          <div class="muted" style="font-size:.84rem">${s.qc.verdict==='Pass'?'Все метрики в пределах установленных порогов.':'Часть метрик вне порогов — см. ниже.'}</div>
          ${s.qc.failed.length?`<div class="report-block" style="border-color:var(--warn);background:var(--warn-bg);margin:10px 0 0;padding:12px 14px">
            <b style="color:var(--warn)">Не прошли пороги:</b> <span style="font-size:.84rem">${s.qc.failed.join(', ')}</span></div>`:''}
          <details class="dd" style="margin-top:12px"><summary>${icon('chevron-right')} Метрики качества для биоинформатика</summary>
            <div id="qcList" style="margin-top:6px"></div>
            <div class="section-title" style="font-size:.82rem;margin:14px 0 4px">${icon('activity')} Дополнительные скоры</div>
            <div id="qcAdv"></div>
          </details>
        </div></div>
    </div>
    <div class="card" style="margin-bottom:16px"><div class="card__head"><div class="section-title">${icon('table')} Профиль метилирования</div>
      <button class="btn btn--sm" onclick="toast('Скачивание profile.tsv (~1.5 ГБ)')">${icon('download')} TSV</button></div>
      <div class="card__body"><p class="muted" style="margin-top:0;font-size:.83rem">Тепловая карта уровней метилирования по маркерным регионам: строка «Образец» в сравнении с референсными нормой и опухолью.</p>
        <div id="heatmap"></div></div></div>
    <div class="grid" style="grid-template-columns:1fr 1.1fr;align-items:start">
